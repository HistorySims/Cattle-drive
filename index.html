function clampToWorld(e){const W=G.W;const xr=xAtY(W.main,e.y);const lim=W.corr+120;if(e.x<xr-lim)e.x=xr-lim;if(e.x>xr+lim)e.x=xr+lim;if(e.y>W.maxY-40)e.y=W.maxY-40;if(e.y<W.minY+40)e.y=W.minY+40;}

/* ---- wolves ---- */
function updateWolves(dt){
  const H=G.herd,P=G.player;
  for(const w of G.wolves){
    w.life+=dt;
    const pd=hyp(P.x-w.x,P.y-w.y);
    if(w.state!=='flee'&&(pd<108||w.life>28)){w.state='flee';if(pd<108){addFloat(w.x,w.y-14,'Run off!','#f6efd9');}if(w.target)w.target.panic=0.4;}
    if(w.state==='flee'){const ex=w.x-P.x,ey=w.y-P.y,el=hyp(ex,ey)||1;let fx=ex/el,fy=ey/el;const hx=w.x-H.x,hy=w.y-H.y,hl=hyp(hx,hy)||1;fx+=hx/hl*0.6;fy+=hy/hl*0.6;const fl=hyp(fx,fy)||1;w.vx=lerp(w.vx,fx/fl*165,Math.min(1,dt*4));w.vy=lerp(w.vy,fy/fl*165,Math.min(1,dt*4));if(hl>900)w.dead=true;}
    else{
      if(!w.target||w.target.state==='lost'||w.target.state==='penned'||w.target.given){
        let best=null,bs=-1e9;for(const c of G.cows){if(c.state==='lost'||c.state==='penned'||c.given)continue;const along=(c.x-H.x)*H.tx+(c.y-H.y)*H.ty;const sc=c.dc-along*0.4-hyp(c.x-w.x,c.y-w.y)*0.35;if(sc>bs){bs=sc;best=c;}}w.target=best;w.state='stalk';}
      const c=w.target;if(!c){w.state='flee';continue;}
      const ex=c.x-w.x,ey=c.y-w.y,ed=hyp(ex,ey)||1;
      if(w.state==='stalk'){const s=60+(ed<120?18:0);w.vx=lerp(w.vx,ex/ed*s,Math.min(1,dt*3));w.vy=lerp(w.vy,ey/ed*s,Math.min(1,dt*3));if(ed<20)w.state='attack';}
      else{w.vx=lerp(w.vx,c.vx+ex*3,Math.min(1,dt*6));w.vy=lerp(w.vy,c.vy+ey*3,Math.min(1,dt*6));c.panic=1;
        w.bite+=dt;if(w.bite>0.42){w.bite=0;c.head-=1;G.lost.wolves+=1;G.lostToday.wolves+=1;w.acc++;if(w.acc>=3){addFloat(c.x,c.y-14,'−'+w.acc+' head','#f4c4b4');w.acc=0;}
          if(c.head<=0){loseCow(c,'none');w.target=null;}}
        if(ed>42)w.state='stalk';}
    }
    w.x+=w.vx*dt;w.y+=w.vy*dt;const sp=hyp(w.vx,w.vy);if(sp>3)w.ang=angLerp(w.ang,Math.atan2(w.vy,w.vx),Math.min(1,dt*8));w.step+=sp*dt;
  }
  G.wolves=G.wolves.filter(w=>!w.dead);
}

/* ---- rustlers ---- */
function updateRustlers(dt){
  const H=G.herd,P=G.player;const grps=new Set(G.rustlers.map(r=>r.grp));
  for(const grp of grps){
    const mem=G.rustlers.filter(r=>r.grp===grp);
    if(grp.state!=='flee'&&mem.some(r=>hyp(P.x-r.x,P.y-r.y)<112)){grp.state='flee';for(const c of grp.cut)if(c.state==='cut')c.state='stray';addFloat(mem[0].x,mem[0].y-16,'Rustlers run!','#f6efd9');}
    if(grp.state==='approach'){
      const fx=H.x+H.nx*(grp.side>0?H.right+22:H.left-22),fy=H.y+H.ny*(grp.side>0?H.right+22:H.left-22);
      let arrived=0;
      for(const r of mem){const tx=fx+H.tx*(r.i?-28:28),ty=fy+H.ty*(r.i?-28:28);steerTo(r,tx,ty,128,dt);if(hyp(r.x-tx,r.y-ty)<44)arrived++;}
      if(arrived===mem.length){
        const side=grp.side,cand=G.cows.filter(c=>c.state==='herd'&&!c.given).map(c=>({c,b:((c.x-H.x)*H.nx+(c.y-H.y)*H.ny)*side})).sort((a,b)=>b.b-a.b);
        const k=4+((Math.random()*3)|0);grp.cut=cand.slice(0,k).map(o=>o.c);for(const c of grp.cut){c.state='cut';c.grp=grp;c.panic=0.6;}
        const ex=H.nx*side-H.tx*0.25,ey=H.ny*side-H.ty*0.25,el=hyp(ex,ey)||1;grp.ex=ex/el;grp.ey=ey/el;grp.state='drive';
      }
    }else if(grp.state==='drive'){
      let mx=0,my=0,n=0;for(const c of grp.cut){if(c.state!=='cut')continue;mx+=c.x;my+=c.y;n++;}
      if(!n){grp.state='flee';continue;}mx/=n;my/=n;
      for(const r of mem){const tx=mx-grp.ex*42+grp.ey*(r.i?26:-26),ty=my-grp.ey*42-grp.ex*(r.i?26:-26);steerTo(r,tx,ty,118,dt);}
      if(hyp(mx-H.x,my-H.y)>640){let lostHead=0;for(const c of grp.cut)if(c.state==='cut'){lostHead+=c.head;loseCow(c,'rustlers',true);}if(lostHead)addFloat(mx,my-18,'Rustled: '+lostHead+' head','#f4c4b4',2.5);grp.state='flee';}
    }else{
      for(const r of mem){const ex=r.x-H.x,ey=r.y-H.y,el=hyp(ex,ey)||1;steerTo(r,r.x+ex/el*200,r.y+ey/el*200,170,dt);if(el>950)r.dead=true;}
    }
  }
  G.rustlers=G.rustlers.filter(r=>!r.dead);
}
function steerTo(e,tx,ty,max,dt){const ex=tx-e.x,ey=ty-e.y,ed=hyp(ex,ey),want=Math.min(max,ed*2);const vx=ed>1?ex/ed*want:0,vy=ed>1?ey/ed*want:0;e.vx=lerp(e.vx,vx,Math.min(1,dt*3.5));e.vy=lerp(e.vy,vy,Math.min(1,dt*3.5));e.x+=e.vx*dt;e.y+=e.vy*dt;const sp=hyp(e.vx,e.vy);if(sp>3)e.ang=angLerp(e.ang||0,Math.atan2(e.vy,e.vx),Math.min(1,dt*6));e.step=(e.step||0)+sp*dt;if(sp>90&&Math.random()<dt*10)dust(e.x,e.y,0.7);}

/* ---- ambient bison, toll riders, other outfits ---- */
function updateBison(dt){
  const P=G.player;
  for(const b of G.bison){
    const pd=P?hyp(P.x-b.x,P.y-b.y):1e9;let tx=0,ty=0;
    if(pd<170){tx=(b.x-P.x)/pd*70;ty=(b.y-P.y)/pd*70;}
    else{b.gz-=dt;if(b.gz<0){b.gz=2+Math.random()*4;b.wx=(Math.random()-0.5)*10;b.wy=(Math.random()-0.5)*10;}tx=(b.wx||0)+(b.hx-b.x)*0.02;ty=(b.wy||0)+(b.hy-b.y)*0.02;}
    b.vx=lerp(b.vx,tx,Math.min(1,dt*2));b.vy=lerp(b.vy,ty,Math.min(1,dt*2));b.x+=b.vx*dt;b.y+=b.vy*dt;const sp=hyp(b.vx,b.vy);if(sp>2)b.ang=angLerp(b.ang,Math.atan2(b.vy,b.vx),dt*3);b.step+=sp*dt;
    if(pd<170){b.hx=b.x;b.hy=b.y;}
  }
}
function updateNpcs(dt){for(const n of G.npcs){if(n.kind==='toll'){const H=G.herd;n.ang=angLerp(n.ang,Math.atan2(H.y-n.y,H.x-n.x),dt*2);}}
  if(G.others)for(const o of G.others){o.y+=o.vy*dt;o.x+=(xAtY(G.W.main,o.y)+(o.x>xAtY(G.W.main,o.y)?640:-640)-o.x)*Math.min(1,dt*0.5);if(Math.random()<dt*5)G.fx.push({x:o.x+(Math.random()-0.5)*120,y:o.y+(Math.random()-0.5)*60,vx:8,vy:-4,life:0,max:6,r:40+Math.random()*30,a:0.16,col:'#c9b48e'});}}

/* ---- losses ---- */
function loseCow(c,cause,silent){
  if(c.state==='lost')return;
  if(cause!=='none'&&cause){G.lost[cause]+=c.head;G.lostToday[cause]+=c.head;}
  if(!silent&&cause!=='none'){const msg={strays:'Lost: '+c.head+' head',river:'Swept away: '+c.head+' head',outside:'Left outside',stampede:''}[cause];if(msg)addFloat(c.x,c.y-14,msg,'#f4c4b4',2.2);}
  G.ghosts.push({x:c.x,y:c.y,ang:c.ang,coat:c.coat,t:0,vx:c.vx,vy:c.vy,swim:c.inWater});
  c.state='lost';c.head=0;
}
function checkLosses(){
  const H=G.herd;
  for(const c of G.cows){
    if(c.state==='lost'||c.state==='penned'||c.given)continue;
    if((c.state==='stray'||c.state==='cut')&&c.dc>770)loseCow(c,c.state==='cut'?'rustlers':'strays');
    else if(c.inWater&&c.entryX!=null&&c.x-c.entryX>212)loseCow(c,'river');
  }
  if(!G.cows.some(c=>c.state!=='lost')&&!G.finished){G.finished=true;showCard({eyebrow:G.D.year,title:'The herd is gone',text:'There is nothing left to drive. Start this season over.',options:[{label:'Start the season over',primary:true,fn:()=>startDrive(G.di,true)}]});}
}

/* ---- pens ---- */
function checkPen(){
  let a=0,p=0,ah=0,ph=0;for(const c of G.cows){if(c.state==='lost'||c.given)continue;a++;ah+=c.head;if(c.state==='penned'){p++;ph+=c.head;}}
  G.penInfo={a,p,ah,ph};
  if(a>0&&p===a&&!G.finished)finishDrive(false);
}
function closeGate(){
  if(G.finished)return;
  for(const c of G.cows){if(c.state!=='lost'&&c.state!=='penned'&&!c.given)loseCow(c,'outside',true);}
  finishDrive(false);
}

/* ---- effects ---- */
function dust(x,y,k){if(G.fx.length>260)return;G.fx.push({x:x+(Math.random()-0.5)*6,y:y+(Math.random()-0.5)*6,vx:(Math.random()-0.5)*8+6,vy:(Math.random()-0.5)*8-3,life:0,max:1.4+Math.random()*1.4,r:5+Math.random()*7,a:0.22*k,col:null});}
function addFloat(x,y,text,col,dur){G.floats.push({x,y,text,col:col||'#f6efd9',t:0,dur:dur||1.8});}
function updateFx(dt){
  for(const p of G.fx){p.life+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=dt*6;}
  G.fx=G.fx.filter(p=>p.life<p.max);
  for(const f of G.floats){f.t+=dt;f.y-=dt*14;}
  G.floats=G.floats.filter(f=>f.t<f.dur);
  for(const g of G.ghosts){g.t+=dt;g.x+=(g.vx||0)*dt*0.5+(g.swim?G.current*30*dt:0);g.y+=(g.vy||0)*dt*0.5;}
  G.ghosts=G.ghosts.filter(g=>g.t<1.4);
  if(G.flash>0)G.flash=Math.max(0,G.flash-dt*2.2);
  if(G.train){G.train.t+=dt;}
}

/* ---- the day ends ---- */
function endDay(){
  const H=G.herd,W=G.W;
  for(const c of G.cows)if((c.state==='stray'||c.state==='cut')&&c.dc>430)loseCow(c,'strays');
  for(const w of G.wolves)w.dead=true;for(const r of G.rustlers){r.dead=true;}for(const c of G.cows)if(c.state==='cut')c.state='stray';
  G.wolves=[];G.rustlers=[];
  const dist=H.s-G.dayStartS,rho=dist/SEG_LEN,b=biomeOfS(W,H.s);
  let dc=-Math.max(0,rho-0.85)*0.06+Math.max(0,0.95-rho)*0.05+(b.grass||0)-0.004;
  const watered=G.waterTouch>3||waterNear(H.x,H.y,430);
  let dry=false;if(b.dry&&!watered){dc-=0.035;dry=true;}
  const runK=(G.runAcc/Math.max(1,G.cows.filter(alive).length))*0.006;dc-=runK;
  const before=G.cond;G.cond=clamp(G.cond+dc,0.4,1);
  G.thirstyNext=dry;
  const rep={day:G.day,rho,dist,cond:G.cond,dCond:G.cond-before,watered,dry,lost:{...G.lostToday},biome:b,runK};
  G.night=true;G.state='night';G.nightK=0;
  for(const c of G.cows){c.vx=c.vy=0;c.grazing=false;}
  let cx=H.x-H.nx*(H.R+70),cy=H.y-H.ny*(H.R+70);
  if(G.W.laneHalf){cx=H.x-H.tx*(H.R+40);cy=H.y-H.ty*(H.R+40);}
  G.camp={x:cx,y:cy,ang:Math.atan2(H.ty,H.tx)};
  const P=G.player;P.hasTarget=false;P.vx=P.vy=0;P.x=cx+16;P.y=cy+26;P.ang=-PI/2;
  // decisions for tonight
  const decs=[];
  if(W.river&&!G.riverDone&&!G.flags.riverAsked){const ahead=W.river.s-H.s;if(ahead>0&&ahead<SEG_LEN*1.25){G.flags.riverAsked=true;decs.push('river');}}
  if(G.stormTonight&&!G.stormDone){G.stormDone=true;decs.push('storm');}
  G.dec={};
  showNight(rep,decs);
}
function rideOut(){
  const H=G.herd;let extra=0,stampede=false,lateStart=false;
  if(G.dec.river==='wait'){extra=1;G.riverBase=0.74;G.cond=Math.min(1,G.cond+0.008);}
  if(G.dec.storm==='double')lateStart=true;
  if(G.dec.storm==='normal'&&Math.random()<0.62)stampede=true;
  G.day+=1+extra;G.t=lateStart?G.dayLen*0.3:0;
  G.thirsty=G.thirstyNext;for(const c of G.cows)c.drank=false;
  G.stormMorning=G.dec.storm!=null;
  G.night=false;G.state='day';G.dayStartS=H.s;G.runAcc=0;G.waterTouch=0;G.lostToday=zeroLoss();
  const b=biomeOfS(G.W,H.s+SEG_LEN*0.3);
  G.weather=b.dry?'heat':G.stormMorning?'rain':Math.random()<0.16?'overcast':'clear';
  G.stormTonight=false;
  scheduleDay();
  for(const r of G.riders){r.orbit=Math.random()*TAU;}
  hideScreen();showHud(true);
  const P=G.player;P.x=H.x-H.tx*(H.R+40);P.y=H.y-H.ty*(H.R+40);
  if(stampede){doStampede();}
  else banner('Day '+G.day,extra?'The river is down. Cross today.':biomeLabel(b));
  if(G.thirsty)setTimeout(()=>{if(G.state==='day')firstTime('thirst');},1200);
  if(lateStart)callout('The crew is worn out from the night watch. A late start.',3500);
}
function biomeLabel(b){return b.key==='town'?'The railhead at '+G.D.dest:b.label;}
function doStampede(){
  const H=G.herd,dir=Math.random()*TAU,ux=Math.cos(dir),uy=Math.sin(dir);
  const al=G.cows.filter(c=>c.state!=='lost');shuffle(al);
  const nLose=Math.max(2,Math.round(al.length*(0.06+Math.random()*0.05)));
  let lostHead=0;
  for(let i=0;i<al.length;i++){const c=al[i];if(i<nLose){lostHead+=c.head;G.lost.stampede+=c.head;c.state='lost';c.head=0;continue;}
    const d=60+Math.random()*230;c.x+=ux*d+(Math.random()-0.5)*170;c.y+=uy*d+(Math.random()-0.5)*170;hardCollide(c,6.5);clampToWorld(c);c.panic=0.5;}
  G.cond=Math.max(0.4,G.cond-0.03);
  updateHerdStats();
  showCard({eyebrow:'Day '+G.day,title:'Stampede!',text:`Lightning set the herd running in the night. ${int(lostHead)} head are gone for good, and the rest are scattered across the country. Round them up.`,options:[{label:'Ride out',primary:true,fn:()=>{}}]});
}
/* ================= Rendering ================= */
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d');
let DPR=1,cssW=1,cssH=1,baseZoom=1,hudH=0,stripH=0,frameDt=0.016;
function resize(){
  const r=canvas.getBoundingClientRect();cssW=Math.max(1,r.width);cssH=Math.max(1,r.height);
  DPR=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(cssW*DPR);canvas.height=Math.round(cssH*DPR);
  baseZoom=clamp(Math.min(cssW,cssH)/560,0.58,2.4);
  const ts=clamp(baseZoom*DPR,1,DPR>2?1.7:2);if(Math.abs(ts-TILES.scale)>0.12){TILES.scale=ts;clearTiles();}
  measureHud();sizeStrip();
}
function measureHud(){const h=document.getElementById('hud');hudH=h&&!h.hidden?h.getBoundingClientRect().height:0;document.documentElement.style.setProperty('--hud-h',Math.round(hudH||56)+'px');const s=document.getElementById('strip');stripH=s&&!s.hidden?52:0;}
function viewCY(){return hudH+(cssH-hudH-stripH)/2;}
function screenToWorld(sx,sy){const v=G.view;if(!v)return{x:0,y:0};return{x:(sx-v.ox)/v.z,y:(sy-v.oy)/v.z};}
function worldToScreen(x,y){const v=G.view;return{x:x*v.z+v.ox,y:y*v.z+v.oy};}

function updateCamera(dt){
  const H=G.herd,P=G.player,cam=G.cam;if(!G.W)return;
  let cx,cy,z=1;
  if(G.state==='night'&&G.camp){cx=(H.x*0.6+G.camp.x*0.4)+(cssW>900?cssW*0.2:0)/baseZoom;cy=(H.y*0.6+G.camp.y*0.4)+(cssW<=900&&cssH>cssW?cssH*0.24:0)/baseZoom;z=0.96;}
  else if((G.state==='finishing'||G.state==='receipt')&&G.W.town&&G.gateClosed){const T=G.W.town;cx=T.x+90;cy=T.railY+70;z=1;}
  else if(G.state==='title'||G.state==='brief'||G.state==='loading'){const wide=cssW>cssH*1.1;cx=H.x-(wide?cssW*0.24:0)/baseZoom;cy=H.y+(wide?0:(cssH*0.31))/baseZoom-10;z=1;}
  else{
    cx=H.x+H.tx*60;cy=H.y+H.ty*60;
    if(G.mode==='pen'){cx=lerp(cx,G.W.town.gate.x,0.5);cy=lerp(cy,G.W.town.gate.y-60,0.5);}
    if((G.mode==='riverHold'||G.mode==='crossing')&&G.W.river){cy=lerp(cy,riverY(G.W.river,H.x),0.4);}
    if(P){cx+=(P.x-cx)*0.32;cy+=(P.y-cy)*0.32;}
    const hw=(cssW/2)/baseZoom,hh=Math.max(120,(cssH-hudH-stripH)/2)/baseZoom;
    let nx=H.R+40,ny=H.R+40;
    if(P){nx=Math.max(nx,Math.abs(P.x-cx)+64);ny=Math.max(ny,Math.abs(P.y-cy)+64);}
    for(const w of G.wolves){if(w.state!=='flee'&&hyp(w.x-H.x,w.y-H.y)<520){nx=Math.max(nx,Math.abs(w.x-cx)+40);ny=Math.max(ny,Math.abs(w.y-cy)+40);}}
    z=clamp(Math.min(1,hw/nx,hh/ny),0.62,1);
  }
  const k=Math.min(1,dt*2.3);cam.x+=(cx-cam.x)*k;cam.y+=(cy-cam.y)*k;cam.z+=(z-cam.z)*Math.min(1,dt*1.5);
}

function render(now){
  if(!G.W){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#121722';ctx.fillRect(0,0,canvas.width,canvas.height);return;}
  const z=baseZoom*G.cam.z,scx=cssW/2,scy=viewCY(),ox=scx-G.cam.x*z,oy=scy-G.cam.y*z;
  G.view={z,ox,oy,x0:-ox/z,y0:-oy/z,x1:(cssW-ox)/z,y1:(cssH-oy)/z};
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#787b52';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.setTransform(DPR*z,0,0,DPR*z,DPR*ox,DPR*oy);
  drawTilesView();
  drawWaterAnim(now);
  drawTrailArrows(now);
  drawEntities(now);
  drawWorldWeather(now);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawLighting(now);
  drawScreenWeather();
  drawSigns();
  drawIndicators(now);
  drawFloats();
}

function placeholderColor(tx,ty){const b=biomeKeyAt(G.W,(tx+0.5)*TILE,(ty+0.5)*TILE);return css(b.g2C);}
function drawTilesView(budgetMs){
  const v=G.view,W=G.W;
  const tx0=Math.floor(v.x0/TILE),tx1=Math.floor(v.x1/TILE),ty0=Math.floor(v.y0/TILE),ty1=Math.floor(v.y1/TILE);
  const missing=[];
  for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++){const t=getTile(tx,ty);if(t)ctx.drawImage(t,tx*TILE,ty*TILE,TILE+0.6,TILE+0.6);else missing.push([tx,ty]);}
  const cxT=(v.x0+v.x1)/2/TILE,cyT=(v.y0+v.y1)/2/TILE;
  const end=performance.now()+(budgetMs||(G.state==='loading'?40:10));
  if(missing.length){
    missing.sort((a,b)=>hyp(a[0]+0.5-cxT,a[1]+0.5-cyT)-hyp(b[0]+0.5-cxT,b[1]+0.5-cyT));
    for(const[tx,ty]of missing){
      if(performance.now()<end){const t=makeTile(W,tx,ty);ctx.drawImage(t,tx*TILE,ty*TILE,TILE+0.6,TILE+0.6);}
      else{ctx.fillStyle=placeholderColor(tx,ty);ctx.fillRect(tx*TILE,ty*TILE,TILE+0.6,TILE+0.6);}
    }
  }else if(G.state==='day'||G.state==='night'||G.state==='title'){
    // prefetch a ring of tiles, leaning in the direction of travel
    const H=G.herd,dx=Math.round(H.tx*1.2),dy=Math.round(H.ty*1.2);
    const pend=performance.now()+4;
    for(let ty=ty0-1+Math.min(0,dy);ty<=ty1+1+Math.max(0,dy);ty++)for(let tx=tx0-1+Math.min(0,dx);tx<=tx1+1+Math.max(0,dx);tx++){
      if(performance.now()>pend)return;if(!TILES.cache.has(tileKey(tx,ty)))makeTile(W,tx,ty);}
  }
}
function prewarm(W,cx,cy,w,h,onProgress,done){
  const list=[];const tx0=Math.floor((cx-w/2)/TILE),tx1=Math.floor((cx+w/2)/TILE),ty0=Math.floor((cy-h/2)/TILE),ty1=Math.floor((cy+h/2)/TILE);
  for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++)list.push([tx,ty]);
  list.sort((a,b)=>hyp(a[0]*TILE-cx,a[1]*TILE-cy)-hyp(b[0]*TILE-cx,b[1]*TILE-cy));
  let i=0;
  (function step(){const end=performance.now()+24;while(i<list.length&&performance.now()<end){const[tx,ty]=list[i++];if(!TILES.cache.has(tileKey(tx,ty)))makeTile(W,tx,ty);}
    onProgress&&onProgress(i/list.length);if(i<list.length)setTimeout(step,0);else done&&done();})();
}

/* ---- animated water, windmills ---- */
function drawWaterAnim(now){
  const W=G.W,v=G.view,t=now/1000;
  if(W.river&&W.river.y0>v.y0-320&&W.river.y0<v.y1+320){
    const R=W.river,cur=G.riverDone?0.55:G.current||0.6;
    ctx.lineCap='round';
    const span=v.x1-v.x0+240;
    for(let i=0;i<70;i++){
      const fr=(i*0.6180339)%1,lane=((i*0.4142)%1)*2-1,spd=24+cur*58+fr*12;
      const xx=v.x0-120+((fr*span+t*spd)%span),hw=riverHW(R,xx),y=riverY(R,xx)+lane*hw*0.86;
      const len=10+cur*22;
      ctx.strokeStyle=`rgba(246,222,196,${0.2+0.38*Math.min(1,cur)*(1-Math.abs(lane)*0.5)})`;ctx.lineWidth=1.3;
      ctx.beginPath();ctx.moveTo(xx,y);ctx.lineTo(xx+len,riverY(R,xx+len)+lane*riverHW(R,xx+len)*0.86);ctx.stroke();
      if(cur>0.85&&i%3===0){ctx.strokeStyle=`rgba(250,240,225,${0.35*(cur-0.85)/0.35})`;ctx.beginPath();ctx.arc(xx+len+3,y,2.2,PI*1.1,PI*1.9);ctx.stroke();}
    }
  }
  for(const c of W.creeks){if(c.y0<v.y0-200||c.y0>v.y1+200)continue;
    ctx.fillStyle='rgba(225,240,232,0.5)';
    for(let i=0;i<14;i++){const fr=(i*0.618)%1,xx=v.x0+((fr*(v.x1-v.x0)+t*(14+fr*8))%(v.x1-v.x0));const y=creekY(c,xx)+Math.sin(i*1.7)*c.hw*0.4;ctx.fillRect(xx,y,3,0.8);}}
  for(const m of W.windmills){if(m.x<v.x0-40||m.x>v.x1+40||m.y<v.y0-40||m.y>v.y1+40)continue;drawWindmillBlades(m,t);}
}
function drawWindmillBlades(m,t){
  ctx.save();ctx.translate(m.x,m.y-2);
  ctx.fillStyle='rgba(20,20,10,0.22)';ctx.beginPath();ctx.ellipse(9,10,13,5,0.3,0,TAU);ctx.fill();
  ctx.strokeStyle='#5a5148';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-14,4);ctx.stroke();
  ctx.fillStyle='#8c8274';ctx.beginPath();ctx.moveTo(-14,4);ctx.lineTo(-22,1);ctx.lineTo(-21,8);ctx.closePath();ctx.fill();
  const a0=t*3+m.ph;ctx.strokeStyle='#d6d0c2';ctx.lineWidth=1.6;
  for(let i=0;i<14;i++){const a=a0+i*TAU/14;ctx.beginPath();ctx.moveTo(Math.cos(a)*3,Math.sin(a)*1.4);ctx.lineTo(Math.cos(a)*12,Math.sin(a)*5.2);ctx.stroke();}
  ctx.strokeStyle='#6b6458';ctx.lineWidth=0.8;ctx.beginPath();ctx.ellipse(0,0,12,5.2,0,0,TAU);ctx.stroke();
  ctx.fillStyle='#4b443c';ctx.beginPath();ctx.arc(0,0,1.8,0,TAU);ctx.fill();
  ctx.restore();
}

/* ---- the direction arrow on the ground ---- */
function drawTrailArrows(now){
  if(G.state!=='day'||G.mode==='forced'||G.finished)return;
  const H=G.herd,t=now/1000,ph=(t*28)%60;
  if(G.mode==='pen'){const T=G.W.town;const ex=T.gate.x-H.x,ey=T.gate.y-H.y,el=hyp(ex,ey)||1;if(el<140)return;
    for(let k=0;k<3;k++){const d=Math.min(el-40,H.front+80+k*60+ph);const a=1-(k*60+ph)/180;chevron(H.x+ex/el*d,H.y+ey/el*d,Math.atan2(ey,ex),0.6*a);}return;}
  if(G.mode==='riverHold')return;
  const P=H.branch||G.W.main,base=H.ps+Math.max(60,H.front)+46;
  for(let k=0;k<3;k++){const off=k*60+ph,p=branchPoint(P,base+off);chevron(p.x,p.y,Math.atan2(p.ty,p.tx),0.85*(1-off/180));}
}
function chevron(x,y,a,alpha){
  if(alpha<=0.01)return;ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.scale(1.35,1.35);ctx.globalAlpha=alpha;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle='rgba(28,22,14,0.55)';ctx.lineWidth=7.5;ctx.beginPath();ctx.moveTo(-9,-13);ctx.lineTo(5,0);ctx.lineTo(-9,13);ctx.stroke();
  ctx.strokeStyle='#f5ecd2';ctx.lineWidth=4.2;ctx.stroke();ctx.restore();
}

/* ---- entities ---- */
function drawEntities(now){
  const v=G.view,t=now/1000;
  const inView=(x,y,m)=>x>v.x0-m&&x<v.x1+m&&y>v.y0-m&&y<v.y1+m;
  // shadows and stray rings
  ctx.fillStyle='rgba(20,16,8,0.24)';
  for(const c of G.cows){if(c.state==='lost'||!inView(c.x,c.y,30))continue;const s=c.size;ctx.beginPath();ctx.ellipse(c.x+2.6,c.y+3.6,(G.night?10:11)*s,(G.night?7:5.8)*s,c.ang,0,TAU);ctx.fill();}
  if(G.state==='day'){
    ctx.setLineDash([4,3]);ctx.lineWidth=1.6;
    for(const c of G.cows){if((c.state==='stray'||c.state==='cut')&&inView(c.x,c.y,30)){ctx.strokeStyle=c.state==='cut'?'rgba(200,60,40,0.9)':'rgba(240,160,60,0.95)';ctx.beginPath();ctx.arc(c.x,c.y,15+Math.sin(t*5)*1.5,0,TAU);ctx.stroke();}}
    ctx.setLineDash([]);
  }
  const list=[];
  for(const c of G.cows)if(c.state!=='lost'&&inView(c.x,c.y,30))list.push({y:c.y,f:drawCow,o:c});
  for(const r of G.riders)if(inView(r.x,r.y,30))list.push({y:r.y,f:drawRider,o:r});
  if(G.player&&G.state!=='title')list.push({y:G.player.y,f:drawPlayer,o:G.player});
  for(const w of G.wolves)if(inView(w.x,w.y,30))list.push({y:w.y,f:drawWolf,o:w});

  ctx.save();ctx.globalCompositeOperation='multiply';
  for(const c of G.clouds){
    c.x+=dt*16;c.y-=dt*6;
    if(c.x-cxw>1500)c.x-=3000;if(c.x-cxw<-1500)c.x+=3000;if(c.y-cyw>1500)c.y-=3000;if(c.y-cyw<-1500)c.y+=3000;

    const gr=ctx.createRadialGradient(0,0,c.rx*0.2,0,0,c.rx);gr.addColorStop(0,`rgba(70,80,96,${a})`);gr.addColorStop(1,'rgba(70,80,96,0)');

    const t=now/1000;ctx.save();ctx.globalCompositeOperation='soft-light';
    for(let i=0;i<5;i++){const fr=(i*0.618)%1,span=v.x1-v.x0+900;const x=v.x0-450+((fr*span+t*70)%span),y=v.y0+((i*0.37)%1)*(v.y1-v.y0);
      ctx.save();ctx.translate(x,y);ctx.rotate(-0.35);const gr=ctx.createRadialGradient(0,0,10,0,0,240);gr.addColorStop(0,'rgba(255,250,220,0.22)');gr.addColorStop(1,'rgba(255,250,220,0)');ctx.fillStyle=gr;ctx.scale(1,0.22);ctx.beginPath();ctx.arc(0,0,240,0,TAU);ctx.fill();ctx.restore();}
    ctx.restore();
  }
}

  const need=new Set(decs);

}

/* ---- end of a drive ---- */
function finishDrive(forced){
  if(G.finished&&!forced)return;G.finished=true;
  const D=G.D,head=forced?headAlive():headPenned(),price=forced?D.forced:priceOn(G.day),cond=forced?1:G.cond,per=price*cond;
  const gross=head*per,cost=N_COWS*COW_HEAD*D.texas,damages=Math.round(G.money.damage),cutFine=G.flags.cut&&Math.random()<0.6?400:0;
  const net=gross-cost-G.money.toll-damages-cutFine;
  const res={di:G.di,year:D.year,dest:D.destFull,destShort:D.dest,days:G.day,head,price,cond,per,gross,cost,toll:G.money.toll,damages,cutFine,net,texas:D.texas,market:D.market,forced:!!forced,lost:{...G.lost},mode:HARD?'hard':'easy'};
  G.results[G.di]=res;saveGame();
  showHud(false);$('pill').hidden=true;
  if(!forced){G.gateClosed=true;G.train={t:0};sfx('whistle');G.state='finishing';setTimeout(()=>showReceipt(res),forced?200:3400);}
  else{G.state='finishing';setTimeout(()=>showReceipt(res),300);}
}
function showReceipt(r){
  G.state='receipt';sfx('coin');
  const D=DRIVES[r.di],next=r.di+1<DRIVES.length?DRIVES[r.di+1]:null;
  const lostTotal=LOSS_KEYS.reduce((a,k)=>a+(r.lost[k]||0),0);
  const names={strays:'strays',wolves:'wolves',rustlers:'rustlers',river:'drowned',stampede:'stampede',outside:'left outside the pens',beef:'toll in beef'};
  const rows=[];
  rows.push(['Head tallied',int(r.head)]);
  if(r.forced)rows.push(['Price offered at the fence',money2(r.price)]);
  else{rows.push(['Price per head on day '+r.days,money2(r.price)]);rows.push(['Condition of the herd',pct(r.cond)]);rows.push(['Paid per head',money2(r.per)]);}
  rows.push(['Gross',money(r.gross)]);
  const minus=[['Herd bought in Texas, '+int(N_COWS*COW_HEAD)+' head at $'+r.texas,r.cost]];
  if(r.toll)minus.push(['Grazing toll in the Territory',r.toll]);
  if(r.damages)minus.push(['Crop damages paid to farmers',r.damages]);

  showScreen(`<div class="slip bill"><div class="stack">
    <div class="bill-head"><h2>Bill of Sale</h2><span class="bill-place">${esc(r.dest)} · ${r.year}</span></div>
    <div class="bill-brand">${brandSVG(26)}<span>Received of the owner of this road brand, for cattle delivered${r.forced?' at the company fence':' at the pens'}</span></div>
    <table class="ledger">${rows.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="amt"><span class="hand">${v}</span></td></tr>`).join('')}
      ${minus.map(([k,v])=>`<tr class="minus"><td>Less: ${esc(k)}</td><td class="amt"><span class="hand">−${money(v).replace('−','')}</span></td></tr>`).join('')}
      <tr class="total"><td><b>Net for the season</b></td><td class="amt"><span class="hand" style="color:${r.net<0?'var(--iron)':'#1f2d55'}">${money(r.net)}</span></td></tr></table>
    <p class="tally">${lostTotal?`Lost on the trail: ${int(lostTotal)} head (${LOSS_KEYS.filter(k=>r.lost[k]).map(k=>names[k]+' '+int(r.lost[k])).join(', ')}).`:'Every head made it.'} ${r.days} day${r.days>1?'s':''} on the trail.</p>
    <p><b>The spread:</b> Texas $${r.texas} a head → ${esc(r.forced?'the company fence':r.destShort)} $${r.forced?r.price:r.market} a head = <b>${spread<0?'−':''}$${Math.abs(spread)} a head</b>.</p>
    <p class="takeaway">${esc(D.takeaway)}</p>
    <div class="row"><button class="btn primary" id="bHub" type="button">Back to seasons</button>${next?`<button class="btn" id="bNext" type="button">On to ${next.year}</button>`:''}</div>
  </div></div>`,'dim');
  bind('bHub',()=>{newDrive(r.di);showTitle();});

/* ---- period map for the briefing ---- */
const MAPK=40,MLON=-101.6,MLAT=39.7,MKX=0.86;

const AU={ctx:null,on:true,master:null,wind:null,river:null,white:null,mooT:4};
function audioInit(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return;}
  try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;AU.ctx=new AC();}catch(e){return;}
  const c=AU.ctx;AU.master=c.createGain();AU.master.gain.value=AU.on?0.6:0;AU.master.connect(c.destination);
  const len=c.sampleRate*2,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);let last=0;
  for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.5;}
  const mk=(type,freq,q)=>{const s=c.createBufferSource();s.buffer=buf;s.loop=true;const f=c.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=c.createGain();g.gain.value=0;s.connect(f);f.connect(g);g.connect(AU.master);s.start();return{s,f,g};};
  AU.wind=mk('bandpass',420,0.5);AU.river=mk('lowpass',900,0.3);
  const wb=c.createBuffer(1,c.sampleRate*1.6,c.sampleRate),wd=wb.getChannelData(0);for(let i=0;i<wd.length;i++)wd[i]=Math.random()*2-1;AU.white=wb;
}
function setSound(on){AU.on=on;if(AU.master)AU.master.gain.setTargetAtTime(on?0.6:0,AU.ctx.currentTime,0.05);$('btnSound').classList.toggle('muted',!on);$('btnSound').setAttribute('aria-label',on?'Mute sound':'Turn sound on');try{localStorage.setItem('open-range-sound',on?'1':'0');}catch(e){}}
function audioTick(dt){

  const playing=G.state==='day'||G.state==='night'||G.state==='title'||G.state==='card';
  AU.wind.g.gain.setTargetAtTime(playing?0.045+0.028*Math.sin(now*0.3)+(G.weather==='rain'?0.05:0):0.015,now,0.5);

function sfx(kind){
  if(!AU.ctx||!AU.on)return;const c=AU.ctx,t=c.currentTime,out=AU.master;
  const env=(g,a,peak,d)=>{g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+d);};
  try{
  if(kind==='moo'){const o=c.createOscillator();o.type='sawtooth';const f0=92+Math.random()*48;o.frequency.setValueAtTime(f0*1.12,t);o.frequency.linearRampToValueAtTime(f0,t+0.25);o.frequency.linearRampToValueAtTime(f0*0.8,t+1.1);
    const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=470;bp.Q.value=1.3;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=880;
    const g=c.createGain();env(g,0.18,0.045+Math.random()*0.035,1.25);o.connect(bp);bp.connect(lp);lp.connect(g);g.connect(out);o.start(t);o.stop(t+1.3);}
  else if(kind==='howl'){const o=c.createOscillator();o.type='sine';o.frequency.setValueAtTime(360,t);o.frequency.linearRampToValueAtTime(640,t+0.6);o.frequency.linearRampToValueAtTime(600,t+1.4);o.frequency.linearRampToValueAtTime(420,t+2.1);
    const v=c.createOscillator();v.frequency.value=5.5;const vg=c.createGain();vg.gain.value=9;v.connect(vg);vg.connect(o.frequency);
    const g=c.createGain();env(g,0.4,0.045,2.2);o.connect(g);g.connect(out);o.start(t);v.start(t);o.stop(t+2.3);v.stop(t+2.3);}
  else if(kind==='thunder'){const s=c.createBufferSource();s.buffer=AU.white;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(600,t);lp.frequency.exponentialRampToValueAtTime(90,t+1.4);const g=c.createGain();env(g,0.03,0.5,1.6);s.connect(lp);lp.connect(g);g.connect(out);s.start(t);s.stop(t+1.6);}
  else if(kind==='click'){const o=c.createOscillator();o.type='triangle';o.frequency.value=880;const g=c.createGain();env(g,0.005,0.045,0.06);o.connect(g);g.connect(out);o.start(t);o.stop(t+0.08);}
  else if(kind==='coin'){[1320,1760].forEach((f,i)=>{const o=c.createOscillator();o.type='sine';o.frequency.value=f;const g=c.createGain(),t0=t+i*0.09;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.11,t0+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t0+0.5);o.connect(g);g.connect(out);o.start(t0);o.stop(t0+0.55);});}
  else if(kind==='whistle'){[523,659].forEach(f=>{const o=c.createOscillator();o.type='square';o.frequency.value=f;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1400;const g=c.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.035,t+0.08);g.gain.setValueAtTime(0.035,t+0.9);g.gain.exponentialRampToValueAtTime(0.0001,t+1.2);o.connect(lp);lp.connect(g);g.connect(out);o.start(t);o.stop(t+1.25);});}
  }catch(e){}
}

let lastT=performance.now(),canvasRect=null;
function frame(now){
  const dt=Math.min(0.05,Math.max(0,(now-lastT)/1000));lastT=now;frameDt=dt;
  const steps=G.timeScale>1?Math.round(G.timeScale):1;
  for(let i=0;i<steps;i++)simStep(dt);
  if(G.state==='night'){updateRiders(dt);updateFx(dt);}
  else if(G.state!=='day'&&G.state!=='title')updateFx(dt);
  G.nightK=G.night?Math.min(1,G.nightK+dt/1.4):Math.max(0,G.nightK-dt/1.0);
  updateCamera(dt);
  render(now);
  hudUpdate(dt);
  tutorialTick(dt);
  crewbarUpdate();
  audioTick(dt);
  requestAnimationFrame(frame);
}

function botControl(){
  const P=G.player,H=G.herd;let tx,ty;
  const w=G.wolves.find(w=>w.state!=='flee'),rg=G.rustlers.find(r=>r.grp.state!=='flee');
  if(w){tx=w.x;ty=w.y;}
  else if(rg){tx=rg.x;ty=rg.y;}
  else{
    let far=null,fd=0;for(const c of G.cows){if((c.state==='stray'||c.state==='cut')&&c.dc>fd){fd=c.dc;far=c;}}
    if(far){const ex=far.x-H.x,ey=far.y-H.y,el=hyp(ex,ey)||1;tx=far.x+ex/el*40;ty=far.y+ey/el*40;}
    else if(G.mode==='riverHold'){const calm=G.current<G.riverBase*0.5;const d=calm?H.rear-10:H.rear-110;tx=H.x+H.tx*d+H.nx*30;ty=H.y+H.ty*d+H.ny*30;}
    else if(G.mode==='crossing'){tx=H.x+H.nx*(H.right+20)+H.tx*10;ty=H.y+H.ny*(H.right+20)+H.ty*10;}
    else if(G.mode==='pen'){const T=G.W.town,ex=H.x-T.gate.x,ey=H.y-T.gate.y,el=hyp(ex,ey)||1;tx=H.x+ex/el*(H.R*0.5+40);ty=H.y+ey/el*(H.R*0.5+40);
      G.botPenT=(G.botPenT||0)+1/30;if(G.penInfo&&G.penInfo.p/G.penInfo.a>0.85&&G.botPenT>25){closeGate();return;}}
    else{const sw=Math.sin(G.t*0.9)*(H.right-H.left)*0.42;tx=H.x+H.tx*(H.rear-36)+H.nx*sw;ty=H.y+H.ty*(H.rear-36)+H.ny*sw;}
  }
  P.tx=tx;P.ty=ty;P.hasTarget=true;
}

/* ---- boot ---- */
function boot(data){
  tilesInit();resize();
  try{if(localStorage.getItem('open-range-sound')==='0')AU.on=false;}catch(e){}
  $('btnSound').classList.toggle('muted',!AU.on);
  const sv=(data&&data.save)||loadGame();
  if(sv){G.results=sv.results||[];G.seen=sv.seen||{};}
  const fo=G.results.findIndex((r,i)=>!r),di=G.results.length<DRIVES.length&&fo<0?G.results.length:Math.max(0,fo);
  newDrive(di);G.state='title';
  showTitle();
  requestAnimationFrame(t=>{lastT=t;frame(t);});
}
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({save:{next:G.state==='receipt'?G.di+1:G.di,results:G.results,seen:G.seen}}));}catch(e){}

if(/debug/.test(location.search)||location.hash==='#debug'){
  window.OR={G,DRIVES,BIOMES,doStampede,headAlive,newDrive,startDrive,simStep,render,finishDrive,showEnding,showReceipt,showBrief,showTitle,showNight,rideOut,endDay,polyAt,closeGate,mapSVG,
    jump(s){const W=G.W,H=G.herd;updateHerdStats();const p=polyAt(W.main,s),dx=p.x-H.x,dy=p.y-H.y;
      for(const c of G.cows){c.x+=dx;c.y+=dy;}for(const r of G.riders){r.x+=dx;r.y+=dy;}G.player.x+=dx;G.player.y+=dy;
      H.hintM=-1;H.hintA=-1;updateHerdStats();if(W.river&&s>W.river.s+150)G.riverDone=true;for(const t of G.trig)if(t.s<s-20)t.done=true;
      G.cam.x=H.x;G.cam.y=H.y;G.dayStartS=H.s;},
    ff(sec,dt){dt=dt||1/30;const n=Math.round(sec/dt);for(let i=0;i<n;i++){if(G.state==='day')simStep(dt);else break;}return G.state;},
    play(maxDays){G.bot=true;const out=[];let guard=0;while(guard++<20000){if(G.state==='day')simStep(1/30);else break;if(G.day>maxDays)break;}return{state:G.state,day:G.day,s:G.herd.s,rem:G.herd.rem,cond:G.cond,head:headAlive(),lost:G.lost};},
  };
}
(function(){const hot=window.claude&&window.claude.hot;if(hot&&hot.ready)hot.ready(boot);else boot(hot&&hot.data||{});})();
</script>
