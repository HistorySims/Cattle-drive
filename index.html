<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}[hidden]{display:none!important}</style>
<title>Open Range</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Holtwood+One+SC&family=Spectral:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: the trail fills the screen edge to edge; a slim ledger strip of numbers rides across the top;
   every decision arrives as a paper slip laid over the land. One committed look (sun-washed land, paper, iron-gall ink). */
:root{
  --ink:#231c16;
  --ink-soft:#5b4e3f;
  --paper:#ebe4cf;
  --paper-deep:#ddd3b6;
  --rule:#b8a785;
  --bluebonnet:#35549b;
  --bluebonnet-deep:#263f78;
  --bluebonnet-wash:#d9dde9;
  --iron:#a93f29;
  --sun:#e2aa3c;
  --sage:#6c8a45;
  --night:#121722;
  --night-glass:rgba(17,22,33,.84);
  --night-line:rgba(240,233,215,.14);
  --night-text:#f0e9d7;
  --night-dim:#b4ad97;
  --font-display:"Holtwood One SC","Rockwell Extra Bold","Rockwell",Georgia,serif;
  --font-body:"Spectral","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --font-hand:"Caveat","Bradley Hand","Segoe Print",cursive;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:var(--night)}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:stretch;background:var(--night-glass);color:var(--night-text);
  border-bottom:1px solid var(--night-line);font-variant-numeric:tabular-nums lining-nums;-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
.hud-season{display:flex;flex-direction:column;justify-content:center;padding:6px 14px;border-right:1px solid var(--night-line);min-width:0;flex:0 1 auto}
.hud-season .yr{font-family:var(--font-display);font-size:19px;letter-spacing:.05em;line-height:1.05}
.hud-season .dest{font-size:12.5px;color:var(--night-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:italic}
.hud-stats{display:flex;flex:1 1 auto;min-width:0;order:2}
.stat{display:flex;flex-direction:column;justify-content:center;padding:6px 12px;border-right:1px solid var(--night-line);min-width:0}
.stat .lbl{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--night-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .val{font-size:18px;font-weight:600;line-height:1.2;display:flex;align-items:center;gap:7px;white-space:nowrap}
.bar{display:inline-block;width:52px;height:7px;border-radius:4px;background:rgba(240,233,215,.16);overflow:hidden}
.bar i{display:block;height:100%;width:90%;background:var(--sage);transition:width .5s,background-color .5s}
.sun{position:relative;display:inline-block;width:32px;height:16px;border-radius:16px 16px 0 0;border:1.5px solid rgba(240,233,215,.32);border-bottom:none;overflow:visible}
.sun i{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--sun);left:0;top:100%;box-shadow:0 0 8px var(--sun)}
.trend{font-size:12px;font-weight:400;color:#e89a7f}
.hud-btns{display:flex;align-items:center;gap:6px;padding:0 10px;margin-left:auto;order:3}
.iconbtn{width:38px;height:38px;border-radius:8px;border:1px solid var(--night-line);background:rgba(240,233,215,.04);display:grid;place-items:center;cursor:pointer;padding:0}
.iconbtn:hover{background:rgba(240,233,215,.1)}
.iconbtn svg{width:18px;height:18px;stroke:var(--night-text);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn .off{display:none}
.iconbtn.muted .on{display:none}
.iconbtn.muted .off{display:block}

/* progress strip */
#strip{position:absolute;left:12px;right:12px;bottom:10px;height:38px;z-index:4;pointer-events:none}
#strip canvas{width:100%;height:100%;display:block}

/* contextual pill */
#pill{position:absolute;left:12px;top:calc(var(--hud-h,56px) + 10px);z-index:6;display:flex;align-items:center;gap:10px;padding:7px 8px 7px 14px;
  background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.35);
  font-size:14px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;max-width:calc(100% - 32px)}
#pill .gauge{display:inline-flex;gap:3px}
#pill .gauge i{width:9px;height:14px;border-radius:2px;background:var(--paper-deep);border:1px solid var(--rule)}
#pill .gauge i.on{background:var(--iron);border-color:var(--iron)}
#pill .gauge.calm i.on{background:var(--sage);border-color:var(--sage)}
#pill button{border:none;background:var(--bluebonnet);color:#f5f0e3;padding:6px 12px;border-radius:999px;font-weight:600;cursor:pointer}
#pill button:disabled{background:var(--rule);cursor:default}
#pill .note{font-weight:400;color:var(--ink-soft)}

/* callout (tutorial lines) */
#callout{position:absolute;left:50%;transform:translateX(-50%);top:72px;z-index:6;width:max-content;max-width:min(92%,540px);
  background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-left:4px solid var(--bluebonnet);
  box-shadow:0 8px 26px rgba(0,0,0,.35);padding:9px 14px;border-radius:2px;font-size:15.5px;line-height:1.35;pointer-events:none}

/* day banner */
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;pointer-events:none;z-index:4;color:var(--night-text);
  text-shadow:0 2px 14px rgba(0,0,0,.65),0 0 2px rgba(0,0,0,.5);animation:bannerIn 3.2s ease forwards}
#banner .big{display:block;font-family:var(--font-display);font-size:clamp(36px,7.5vw,68px);letter-spacing:.07em;line-height:1}
#banner .sub{display:block;font-style:italic;font-size:clamp(17px,2.8vw,24px);margin-top:6px}
@keyframes bannerIn{0%{opacity:0;transform:translateY(8px)}12%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}

/* ---------- Screens and paper slips ---------- */
.screen{position:absolute;inset:0;z-index:10;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto;-webkit-overflow-scrolling:touch}
.screen.dim{background:rgba(12,15,23,.5)}
.screen.night{align-items:flex-end;background:linear-gradient(to top,rgba(10,13,20,.55),rgba(10,13,20,0) 60%)}
.slip{position:relative;width:100%;max-width:580px;margin:auto;background:var(--paper);color:var(--ink);border-radius:2px;
  box-shadow:0 22px 60px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.5) inset;padding:22px 24px 20px;
  background-image:radial-gradient(120% 90% at 20% 0%,rgba(255,255,255,.35),rgba(255,255,255,0) 60%),radial-gradient(90% 60% at 100% 100%,rgba(120,90,40,.10),rgba(0,0,0,0) 70%);
  animation:slipIn .35s ease both}
@keyframes slipIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.slip.wide{max-width:900px}
.slip h1,.slip h2{font-family:var(--font-display);font-weight:400;letter-spacing:.04em;line-height:1.05;margin:0;text-wrap:balance}
.slip h1{font-size:clamp(34px,6.4vw,58px)}
.slip h2{font-size:clamp(22px,3.6vw,30px)}
.eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
.lede{font-style:italic;font-size:17px;color:var(--ink-soft);margin:6px 0 0}
.slip p{margin:0;max-width:62ch}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{appearance:none;border:1.5px solid var(--ink);background:transparent;padding:10px 16px;border-radius:3px;cursor:pointer;font-weight:600;font-size:15px;line-height:1.2}
.btn:hover{background:rgba(35,28,22,.06)}
.btn.primary{background:var(--bluebonnet);border-color:var(--bluebonnet-deep);color:#f5f0e3}
.btn.primary:hover{background:var(--bluebonnet-deep)}
.btn.small{padding:7px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary:disabled:hover{background:var(--bluebonnet)}
.btn .sub{display:block;font-weight:400;font-size:12.5px;opacity:.8}
.hr{height:1px;background:var(--rule);border:0;margin:4px 0}
.muted{color:var(--ink-soft)}
.fine{font-size:13px;color:var(--ink-soft)}

/* title */
.title-slip{max-width:620px;text-align:left}
.brandmark{width:54px;height:54px;flex:none}
.title-top{display:flex;gap:14px;align-items:center}
.controls-hint{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14.5px;align-items:baseline}
.controls-hint b{font-weight:700}
/* test-build crew picker */
.crewpick{border:1.5px dashed var(--iron);border-radius:3px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;background:rgba(169,63,41,.05)}
.crewpick .eyebrow{color:var(--iron)}
.seg{display:flex;gap:0;border:1.5px solid var(--ink);border-radius:3px;overflow:hidden;align-self:flex-start}
.seg button{appearance:none;border:0;border-left:1.5px solid var(--ink);background:transparent;font:inherit;font-weight:700;font-size:16px;padding:6px 15px;cursor:pointer;color:var(--ink);line-height:1.1}
.seg button:first-child{border-left:0}
.seg button small{display:block;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.seg button.on{background:var(--ink);color:var(--paper)}
.crewpick .sw{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
.crewpick .sw input{margin-top:3px;accent-color:var(--bluebonnet);width:16px;height:16px}
/* rider switcher */
#crewbar{position:absolute;right:12px;bottom:calc(52px + 10px);z-index:6;display:flex;gap:6px;pointer-events:auto}
#crewbar button{appearance:none;display:flex;align-items:center;gap:8px;padding:6px 10px 6px 7px;border-radius:999px;border:1.5px solid rgba(240,233,215,.25);
  background:var(--night-glass);color:var(--night-text);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;line-height:1.1;text-align:left}
#crewbar button small{display:block;font-size:10.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--night-dim)}
#crewbar button.you{background:var(--paper);color:var(--ink);border-color:var(--paper)}
#crewbar button.you small{color:var(--ink-soft)}
#crewbar .hatdot{width:24px;height:24px;border-radius:50%;border:2px solid;display:grid;place-items:center;flex:none}
#crewbar .hatdot i{width:11px;height:10px;border-radius:50%;display:block}
#crewbar kbd{font:inherit;font-size:11px;opacity:.6;border:1px solid currentColor;border-radius:3px;padding:0 4px}
@media (hover:none),(max-width:700px){#crewbar kbd{display:none}}
@media (max-width:700px){#crewbar{left:12px;right:12px;justify-content:center}#crewbar button{flex:1;justify-content:center;padding:7px 6px;min-height:44px}#crewbar .lb small{display:none}}
/* difficulty */
.modepick{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.modepick .fine{flex:1;min-width:200px}
/* season hub */
.hub-prog{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink-soft)}
.hub-prog .pbar{flex:1;height:6px;background:var(--paper-deep);border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.hub-prog .pbar i{display:block;height:100%;background:var(--sage);transition:width .4s}
.seasons{display:flex;flex-direction:column;gap:7px;margin:0;padding:0;list-style:none}
.season{appearance:none;width:100%;text-align:left;display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;
  background:rgba(255,252,240,.55);border:1.5px solid var(--rule);border-radius:3px;padding:9px 12px;cursor:pointer;color:var(--ink);font:inherit}
.season:hover,.season:focus-visible{border-color:var(--bluebonnet);background:var(--bluebonnet-wash);outline:none}
.season .chk{width:26px;height:26px;border-radius:50%;border:2px dashed var(--rule);display:grid;place-items:center;color:transparent}
.season .chk svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.season.done .chk{border:2px solid var(--sage);background:var(--sage);color:#f5f0e3}
.season .yr{font-family:var(--font-display);font-size:21px;letter-spacing:.04em;line-height:1.1}
.season .yr small{font-family:var(--font-body);font-size:13.5px;letter-spacing:0;font-weight:600;color:var(--ink-soft);margin-left:6px}
.season .tag{font-size:13px;color:var(--ink-soft);line-height:1.3;margin-top:2px}
.season .go{text-align:right;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--bluebonnet);white-space:nowrap}
.season .go .net{display:block;font-family:var(--font-hand);font-size:20px;letter-spacing:0;text-transform:none;color:#1f2d55;font-weight:700;line-height:1}
.season .go .net.neg{color:var(--iron)}
@media (max-width:480px){.season{gap:9px;padding:8px 10px}.season .yr{font-size:19px}.season .yr small{display:block;margin:2px 0 0}.season .go{font-size:11px}.season .go .net{font-size:18px}}

/* briefing */
.brief{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:22px;align-items:start}
.brief .map{width:100%;max-height:72vh}
.brief .map svg{width:100%;height:auto;max-height:72vh;display:block}
.spread{display:grid;grid-template-columns:repeat(3,auto);gap:2px 18px;justify-content:start;align-items:baseline;font-variant-numeric:tabular-nums lining-nums;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:10px 0}
.spread .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
.spread .v{font-family:var(--font-display);font-size:24px;letter-spacing:.03em}
.spread .v.hot{color:var(--bluebonnet)}
@media (max-width:700px){
  .brief{grid-template-columns:1fr}
  .brief .map svg{max-height:34vh;margin:0 auto}
}

/* night camp */
.night-slip{max-width:620px;margin:0 auto 0}
@media (min-width:900px){.screen.night{justify-content:flex-end;align-items:center;padding-right:4vw;background:linear-gradient(to left,rgba(10,13,20,.55),rgba(10,13,20,0) 55%)}.night-slip{max-width:540px;margin:0}}
@media (min-width:900px){.screen.title{justify-content:flex-start;padding-left:6vw}.screen.title .slip{margin:auto 0}}
.bill-brand{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);font-style:italic}
.bill-brand svg{width:26px;height:26px}
.endtable td.total{text-align:right!important}
.report{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14.5px;align-items:baseline}
.report dt{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
.report dd{margin:0}
.report .bad{color:var(--iron);font-weight:600}
.report .good{color:var(--sage);font-weight:600}
.decision{border:1px solid var(--rule);background:rgba(255,255,255,.28);padding:12px;border-radius:2px}
.decision h3{margin:0 0 4px;font-size:17px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:8px}
.choice{text-align:left;border:1.5px solid var(--rule);background:var(--paper);padding:9px 11px;border-radius:3px;cursor:pointer}
.choice b{display:block;font-size:15px}
.choice span{display:block;font-size:13px;color:var(--ink-soft);line-height:1.3;margin-top:2px}
.choice:hover{border-color:var(--ink-soft)}
.choice[aria-pressed="true"]{border-color:var(--bluebonnet);background:var(--bluebonnet-wash);box-shadow:inset 0 0 0 1px var(--bluebonnet)}
.pace{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

/* bill of sale */
.bill{max-width:560px;background-color:#efe8d3;
  background-image:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 27px,rgba(53,84,155,.13) 27px 28px),radial-gradient(120% 90% at 20% 0%,rgba(255,255,255,.35),rgba(255,255,255,0) 60%)}
.bill-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px}
.bill-head h2{font-size:clamp(24px,4.6vw,34px)}
.bill-place{font-style:italic;color:var(--ink-soft)}
.ledger{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums lining-nums;font-size:15px}
.ledger td{padding:3px 0;vertical-align:baseline}
.ledger td:first-child{padding-right:10px}
.ledger td.amt{text-align:right;white-space:nowrap}
.ledger .hand{font-family:var(--font-hand);font-size:23px;line-height:1;color:#1f2d55}
.ledger tr.total td{border-top:2px solid var(--ink);padding-top:6px}
.ledger tr.total .hand{font-size:28px}
.ledger tr.minus .hand{color:var(--iron)}
.takeaway{font-style:italic;border-left:3px solid var(--bluebonnet);padding:2px 0 2px 10px}
.tally{font-size:13px;color:var(--ink-soft)}

/* ending */
.endtable-wrap{overflow-x:auto}
.endtable{border-collapse:collapse;font-variant-numeric:tabular-nums lining-nums;font-size:14px;min-width:560px;width:100%}
.endtable th{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);text-align:right;font-weight:600;padding:4px 6px;border-bottom:1.5px solid var(--ink)}
.endtable th:first-child,.endtable td:first-child,.endtable th:nth-child(2),.endtable td:nth-child(2){text-align:left}
.endtable td{text-align:right;padding:5px 6px;border-bottom:1px solid var(--rule)}
.endtable td.neg{color:var(--iron);font-weight:600}
.prompts{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.chart-wrap{overflow-x:auto}

/* loading */
.loading{font-style:italic;color:var(--night-text);text-align:center}
.loading .track{width:220px;height:4px;background:rgba(240,233,215,.15);margin:10px auto 0;border-radius:2px;overflow:hidden}
.loading .track i{display:block;height:100%;width:0;background:var(--sun);transition:width .15s}

@media (max-width:760px){
  #hud{flex-wrap:wrap}
  .hud-season{flex:1 1 auto;flex-direction:row;align-items:baseline;justify-content:flex-start;gap:8px;border-right:none;padding:6px 12px 2px}
  .pl-dest{display:none}
  .hud-btns{padding:4px 8px 0;order:2}
  .hud-stats{order:3;flex:1 1 100%;border-top:1px solid var(--night-line)}
  .stat{flex:1 1 0;padding:4px 8px 5px}
  .stat .lbl{font-size:9.5px;letter-spacing:.1em}
  .stat .val{font-size:15.5px;gap:5px}
  .bar{width:30px}
  .sun{width:22px;height:11px}
  .iconbtn{width:34px;height:34px}
  #callout{top:auto;bottom:66px;font-size:14.5px}
  body:has(#crewbar:not([hidden])) #callout{bottom:122px}
  .slip{padding:18px 16px 16px}
}
@media (max-width:380px){ .stat:nth-child(2) .bar{display:none} }
@media (prefers-reduced-motion:reduce){ .slip,#banner{animation:none} }
</style>
</head>
<body>
<div id="app">
  <canvas id="world" aria-label="The cattle trail, seen from above. Tap or click to ride."></canvas>
  <header id="hud" hidden>
    <div class="hud-season"><span class="yr" id="hudYear">1867</span><span class="dest" id="hudDest">to Abilene, Kansas</span></div>
    <div class="hud-btns">
      <button class="iconbtn" id="btnSound" type="button" aria-label="Sound on or off">
        <svg class="on" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg class="off" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
      </button>
      <button class="iconbtn" id="btnPause" type="button" aria-label="Pause">
        <svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>
      </button>
    </div>
    <div class="hud-stats">
      <div class="stat"><span class="lbl">Head</span><span class="val" id="hudHead">2,500</span></div>

let QSTAMP=1;
Grid.prototype.query=function(x1,y1,x2,y2,cb){const c=this.c,st=++QSTAMP;const gx0=Math.floor(x1/c),gx1=Math.floor(x2/c),gy0=Math.floor(y1/c),gy1=Math.floor(y2/c);
  for(let gx=gx0;gx<=gx1;gx++)for(let gy=gy0;gy<=gy1;gy++){const a=this.m.get((gx+30000)*60000+(gy+30000));if(!a)continue;for(let i=0;i<a.length;i++){const o=a[i];if(o._q===st)continue;o._q=st;cb(o);}}};

function addObj(W,o){W.objs.push(o);const r=Math.max(o.r||0,o.solid||0)+2;W.grid.add(o,o.x-r,o.y-r,o.x+r,o.y+r);return o;}
function addFence(W,x1,y1,x2,y2,kind,extra){const o={type:'fence',kind,x1,y1,x2,y2};if(extra)Object.assign(o,extra);W.fences.push(o);W.grid.add(o,Math.min(x1,x2)-6,Math.min(y1,y2)-6,Math.max(x1,x2)+6,Math.max(y1,y2)+6);return o;}

/* route */
function genRoute(D,rnd){
  const total=D.segs.length*SEG_LEN+TOWN_LEN,home=mulberry32(777),step=20;
  const pts=[[0,0]];let a=-PI/2,x=0,y=0,s=0;
  while(s<total){const r=s<640?home:rnd;a+=(r()-0.5)*0.2;a+=(-PI/2-a)*0.045;if(s>total-580)a+=(-PI/2-a)*0.3;a=clamp(a,-PI/2-0.6,-PI/2+0.6);
    x+=Math.cos(a)*step;y+=Math.sin(a)*step;s+=step;pts.push([x,y]);}
  for(let p=0;p<4;p++)for(let i=1;i<pts.length-1;i++)pts[i][0]=(pts[i-1][0]+2*pts[i][0]+pts[i+1][0])/4;
  return buildPoly(pts);
}
function genAlt(W,sa,sb,bulge){
  const pts=[],n=Math.ceil((sb-sa)/16);
  for(let i=0;i<=n;i++){const s=sa+(sb-sa)*i/n,p=polyAt(W.main,s),t=i/n,w=Math.pow(Math.sin(PI*t),0.8)*bulge;pts.push([p.x+w,p.y]);}
  return buildPoly(pts);
}
function makeCreek(W,s,hw,rnd,name){const p=polyAt(W.main,s);return{y0:p.y,x0:p.x,a1:30+rnd()*32,l1:150+rnd()*110,p1:rnd()*TAU,a2:9+rnd()*14,l2:60+rnd()*40,p2:rnd()*TAU,hw,name:name||'',s};}
function creekY(c,x){const u=x-c.x0;return c.y0+c.a1*(Math.sin(u/c.l1+c.p1)-Math.sin(c.p1))+c.a2*(Math.sin(u/c.l2+c.p2)-Math.sin(c.p2));}
function makeRiver(W,s,rnd){const p=polyAt(W.main,s);return{y0:p.y,x0:p.x,a1:62,l1:520,p1:rnd()*TAU,a2:22,l2:170,p2:rnd()*TAU,s};}
function riverY(r,x){const u=x-r.x0;return r.y0+r.a1*(Math.sin(u/r.l1+r.p1)-Math.sin(r.p1))+r.a2*(Math.sin(u/r.l2+r.p2)-Math.sin(r.p2));}
function riverHW(r,x){return 64+9*Math.sin((x-r.x0)/260+1.3);}

/* biome lookup with warped, blended borders */
function biomeAt(W,x,y,out){
  const warp=W.nA.n2(x*0.0021+11.3,y*0.0021-4.1)*170+W.nB.n2(x*0.006+2.2,y*0.006+8.1)*42;
  const s=sAtYPoly(W.main,y+warp),nseg=W.segs.length,f=clamp(s/SEG_LEN,0,nseg-0.0001),k=Math.floor(f),fr=f-k;
  let A=W.segs[k],B=A,t=0;
  if(fr>0.8&&k+1<nseg){B=W.segs[k+1];t=sstep(0.8,1.2,fr);}
  else if(fr<0.2&&k>0){B=W.segs[k-1];t=sstep(0.2,-0.2,fr);}
  out.A=A;out.B=B;out.t=t;out.tz=sstep(W.len-TOWN_LEN-150,W.len-TOWN_LEN+130,s);out.s=s;
  return out;
}
const _bm={};
function biomeKeyAt(W,x,y){biomeAt(W,x,y,_bm);if(_bm.tz>0.5)return BIOMES.town;return _bm.t>0.5?_bm.B:_bm.A;}
function biomeOfS(W,s){const k=clamp(Math.floor(s/SEG_LEN),0,W.segs.length-1);return s>W.len-TOWN_LEN?BIOMES.town:W.segs[k];}

function trailDist(W,x,y){
  const step=W.main.len/(W.main.n-1);
  const i=clamp(Math.round(sAtYPoly(W.main,y)/step),0,W.main.n-2);
  let d=polyProject(W.main,x,y,i,10).d;
  if(W.alt){const s2=sAtYPoly(W.alt,y);if(s2>-260&&s2<W.alt.len+260){const st2=W.alt.len/(W.alt.n-1);const i2=clamp(Math.round(s2/st2),0,W.alt.n-2);d=Math.min(d,polyProject(W.alt,x,y,i2,10).d);}}
  return d;
}
function inRect(r,x,y,m){m=m||0;return x>r.x1-m&&x<r.x2+m&&y>r.y1-m&&y<r.y2+m;}
function rectsOverlap(a,b,m){m=m||0;return a.x1-m<b.x2&&a.x2+m>b.x1&&a.y1-m<b.y2&&a.y2+m>b.y1;}

function buildWorld(di){
  const D=DRIVES[di];
  const W={di,D,seed:9100+di*977,segs:D.segs.map(k=>BIOMES[k]),objs:[],fences:[],fields:[],pastures:[],creeks:[],signs:[],npcs:[],windmills:[],buildings:[],extras:[],grid:new Grid(GRID)};
  W.nA=makeNoise(31);W.nB=makeNoise(57);W.nC=makeNoise(91);W.nD=makeNoise(W.seed+5);
  const rnd=mulberry32(W.seed);
  W.main=genRoute(D,rnd);W.len=W.main.len;
  let mnx=1e9,mxx=-1e9;for(let i=0;i<W.main.n;i++){mnx=Math.min(mnx,W.main.xs[i]);mxx=Math.max(mxx,W.main.xs[i]);}
  W.corr=D.corr||1400;
  W.minX=mnx-W.corr-260;W.maxX=mxx+W.corr+260;W.minY=W.main.ys[W.main.n-1]-720;W.maxY=720;
  if(D.fork==='dry'){const k=D.segs.indexOf('dry');W.altA=k*SEG_LEN-140;W.altB=(k+1)*SEG_LEN+100;W.alt=genAlt(W,W.altA,W.altB,560);W.altKind='water';}
  if(D.fenceCut){W.altA=0.42*SEG_LEN+80;W.altB=1.52*SEG_LEN;W.alt=genAlt(W,W.altA,W.altB,-600);W.altKind='detour';}
  W.trails=[W.main];if(W.alt)W.trails.push(W.alt);
  if(D.river){const k=D.segs.indexOf('river');W.river=makeRiver(W,(k+0.55)*SEG_LEN,rnd);}
  const homeR=mulberry32(555);
  for(const f of D.creeks){const s=f*SEG_LEN;W.creeks.push(makeCreek(W,s,f<0.5?11:8+rnd()*3,f<0.5?homeR:rnd));}
  if(D.nueces)W.creeks.push(makeCreek(W,W.len-TOWN_LEN-120,15,rnd,'Nueces River'));
  genTown(W,rnd);
  genHome(W);
  if(D.toll)genToll(W,rnd);
  if(D.fork==='dry')genForkSigns(W,rnd);
  genFarms(W,rnd);
  genWire(W,rnd);
  genFeatures(W);
  if(D.bison)genBison(W,rnd);
  return W;
}

/* ---- the railhead town ---- */
function genTown(W,rnd){
  const E=polyAt(W.main,W.len),ex=E.x,ey=E.y,st=W.D.townStyle;
  const T={x:ex,y:ey,style:st,name:W.D.dest};
  T.railY=ey-224;T.sidingY=ey-196;
  T.pen={x1:ex-178,x2:ex+178,y1:ey-176,y2:ey-12};T.pen.cx=ex;T.pen.cy=(T.pen.y1+T.pen.y2)/2;
  T.gate={x:ex,y:T.pen.y2,hw:62};
  T.zone={x1:ex-1250,x2:ex+1250,y1:ey-640,y2:ey+170};
  W.town=T;
  const P=T.pen;
  addFence(W,P.x1,P.y1,P.x2,P.y1,'pen');addFence(W,P.x1,P.y1,P.x1,P.y2,'pen');addFence(W,P.x2,P.y1,P.x2,P.y2,'pen');
  addFence(W,P.x1,P.y2,ex-T.gate.hw,P.y2,'pen');addFence(W,ex+T.gate.hw,P.y2,P.x2,P.y2,'pen');
  addFence(W,ex-T.gate.hw,P.y2,ex-T.gate.hw-78,P.y2+66,'pen');addFence(W,ex+T.gate.hw,P.y2,ex+T.gate.hw+78,P.y2+66,'pen');
  // side pens (other outfits' cattle in them)
  T.sidePens=[{x1:ex-330,x2:ex-188,y1:ey-176,y2:ey-82},{x1:ex+188,x2:ex+330,y1:ey-176,y2:ey-82}];
  for(const sp of T.sidePens){addFence(W,sp.x1,sp.y1,sp.x2,sp.y1,'pen');addFence(W,sp.x1,sp.y2,sp.x2,sp.y2,'pen');addFence(W,sp.x1,sp.y1,sp.x1,sp.y2,'pen');addFence(W,sp.x2,sp.y1,sp.x2,sp.y2,'pen');
    sp.cows=[];const n=W.D.crowd?9:5;for(let i=0;i<n;i++)sp.cows.push({x:sp.x1+14+rnd()*(sp.x2-sp.x1-28),y:sp.y1+12+rnd()*(sp.y2-sp.y1-24),a:rnd()*TAU,coat:(rnd()*COATS.length)|0});}
  const B=(x,y,w,h,kind)=>{const b={type:'bldg',x1:x-w/2,y1:y-h/2,x2:x+w/2,y2:y+h/2,x,y,w,h,kind,style:st,seed:(rnd()*1e9)|0,r:Math.max(w,h)/2+4};W.buildings.push(b);W.grid.add(b,b.x1-4,b.y1-4,b.x2+4,b.y2+4);return b;};
  T.depot=B(ex+268,T.railY-60,130,46,'depot');
  T.tower={x:ex+120,y:T.railY-56,r:15};
  const big=st==='kansas'||st==='fortworth'||st==='sa';
  const nRow=st==='cotulla'?3:big?8:5;
  for(const side of[-1,1]){
    for(const rowY of[ey-164,ey-74]){
      let x=ex+side*360;
      for(let i=0;i<nRow;i++){const w=44+rnd()*30,h=34+rnd()*14;if(rnd()<0.82)B(x+side*w/2,rowY,w,h,i===0&&rowY>ey-100&&side>0?'hotel':'store');x+=side*(w+10+rnd()*14);}
    }
  }
  // houses north of the rails
  const nH=st==='cotulla'?7:16;
  for(let i=0;i<nH;i++){const x=ex+(rnd()-0.5)*1700,y=T.railY-110-rnd()*300;if(Math.abs(x-T.depot.x)<120&&Math.abs(y-T.depot.y)<80)continue;B(x,y,26+rnd()*14,20+rnd()*10,'house');}
  T.props=[];for(let i=0;i<(st==='cotulla'?5:12);i++){const side=rnd()<0.5?-1:1,x=ex+side*(380+rnd()*620),y=ey-118+(rnd()-0.5)*24;T.props.push({kind:rnd()<0.45?'wagon':'horse',x,y,a:rnd()<0.5?0:PI,seed:(rnd()*1e9)|0,horse:HORSES[(rnd()*HORSES.length)|0]});}
  T.cars=[];const nc=st==='cotulla'?4:6;for(let i=0;i<nc;i++)T.cars.push(ex-150*nc/2.6+i*56);
}

function genHome(W){
  const hx=-150,hy=86;
  W.home={x:hx,y:hy};
  const b={type:'bldg',x1:hx-18,y1:hy-13,x2:hx+18,y2:hy+13,x:hx,y:hy,w:36,h:26,kind:'jacal',seed:42,r:24};
  W.buildings.push(b);W.grid.add(b,b.x1-4,b.y1-4,b.x2+4,b.y2+4);
  W.extras.push({type:'corral',x:72,y:110,r:58,seed:7});
}

function genToll(W,rnd){
  const k=W.D.segs.indexOf('territory'),s=(k+0.33)*SEG_LEN,p=polyAt(W.main,s);
  const cx=p.x+178,cy=p.y;W.toll={s,x:cx,y:cy,done:false};
  const b={type:'bldg',x1:cx-20,y1:cy-15,x2:cx+20,y2:cy+15,x:cx,y:cy,w:40,h:30,kind:'cabin',seed:9,r:26};W.buildings.push(b);W.grid.add(b,b.x1-4,b.y1-4,b.x2+4,b.y2+4);
  W.extras.push({type:'flag',x:cx-34,y:cy-20});
  W.npcs.push({kind:'toll',x:cx-62,y:cy+6,ang:PI,hat:'#3b3027',shirt:'#7d4b3a',horse:'#5a3a24'},{kind:'toll',x:cx-58,y:cy+34,ang:PI*0.95,hat:'#2c2622',shirt:'#c9b58f',horse:'#b8b2a8'});
}
function genForkSigns(W){
  const p=polyAt(W.main,W.altA+150);W.signs.push({x:p.x-58,y:p.y,lines:['DRY ROUTE','short · no water']});
  const q=polyAt(W.alt,170);W.signs.push({x:q.x+58,y:q.y,lines:['WATER HOLES','the long way']});
  for(const t of[0.3,0.52,0.74]){const a=polyAt(W.alt,W.alt.len*t);addObj(W,{type:'pond',x:a.x+(t===0.52?44:-40),y:a.y,r:34+t*12,seed:(t*1e6)|0,water:true});}
}
function genBison(W,rnd){
  W.bisonGroups=[];
  W.segs.forEach((b,k)=>{if(b.key!=='prairie')return;const p=polyAt(W.main,(k+0.5)*SEG_LEN);const side=rnd()<0.5?-1:1;W.bisonGroups.push({x:p.x+side*(620+rnd()*260),y:p.y,n:9+((rnd()*6)|0)});});
}

/* ---- settlers' fields ---- */
function genFarms(W,rnd){
  const F=W.D.farms;if(!F)return;
  const sFrom=F.from<0?W.len-TOWN_LEN+F.from*SEG_LEN:F.from*SEG_LEN,sTo=Math.min(W.len-TOWN_LEN-40,F.to*SEG_LEN);
  for(let s=sFrom;s<sTo;s+=250){
    const p=polyAt(W.main,s);
    for(const side of[-1,1])for(let off=200;off<1180;off+=310){
      if(rnd()>F.p)continue;
      const w=210+rnd()*130,h=170+rnd()*120,cx=p.x+side*(off+w/2+rnd()*40),cy=p.y+(rnd()-0.5)*90;
      const f={x1:cx-w/2,x2:cx+w/2,y1:cy-h/2,y2:cy+h/2,kind:F.kind,seed:(rnd()*1e9)|0,side};
      f.crop=F.kind==='kansas'?(rnd()<0.6?'wheat':'corn'):(rnd()<0.55?'cotton':'corn');
      f.dir=rnd()<0.5?0:1;
      if(W.fields.some(o=>rectsOverlap(o,f,34)))continue;
      if(rectsOverlap(f,W.town.zone,-200)&&inRect(W.town.zone,cx,cy,-150))continue;
      if(Math.abs(cx-W.town.x)<460&&cy<W.town.y+190&&cy>W.town.y-660)continue;
      let ok=true;
      for(const [qx,qy] of[[f.x1,f.y1],[f.x2,f.y1],[f.x1,f.y2],[f.x2,f.y2],[cx,f.y1],[cx,f.y2],[f.x1,cy],[f.x2,cy],[cx,cy]]){if(trailDist(W,qx,qy)<165){ok=false;break;}}
      if(!ok)continue;
      if(W.creeks.some(c=>Math.abs(creekY(c,cx)-cy)<h/2+50))continue;
      if(W.river&&Math.abs(riverY(W.river,cx)-cy)<h/2+240)continue;
      if(F.kind==='kansas'&&rnd()<0.7)f.hedge=rnd()<0.5?'n':'w';
      W.fields.push(f);
      // farmhouse on the outer corner
      const hx=side>0?f.x2+24:f.x1-24,hy=f.y1+22;
      const b={type:'bldg',x1:hx-13,y1:hy-10,x2:hx+13,y2:hy+10,x:hx,y:hy,w:26,h:20,kind:F.kind==='kansas'?'soddy':'farmhouse',seed:f.seed+1,r:18};
      W.buildings.push(b);W.grid.add(b,b.x1-4,b.y1-4,b.x2+4,b.y2+4);
      f.house=b;
    }
  }
}

/* ---- barbed wire pastures ---- */
function genWire(W,rnd){
  const Wc=W.D.wire;W.lanes=W.trails;if(!Wc)return;
  const half=Wc.lane/2;W.laneHalf=half;
  W.forceBands=[];
  if(W.D.fenceCut){const sc=(W.altA+W.altB)/2;W.crossS=sc;const p=polyAt(W.main,sc);W.crossY=p.y;W.forceBands.push({y1:p.y-300,y2:p.y+300});}
  if(W.D.blocked){const sb=W.len-TOWN_LEN-250;W.blockS=sb;const p=polyAt(W.main,sb);W.blockY=p.y;W.forceBands.push({y1:p.y-340,y2:p.y+300});}
  const pw=560,ph=470,ox=rnd()*pw,oy=rnd()*ph,sFrom=Wc.from*SEG_LEN;
  for(let y=W.minY-oy;y<W.maxY;y+=ph){
    for(let x=W.minX-ox;x<W.maxX;x+=pw){
      const x1=x,x2=x+pw,y1=y,y2=y+ph;
      if(sAtYPoly(W.main,(y1+y2)/2)<sFrom)continue;
      if(rectsOverlap({x1,x2,y1,y2},W.town.zone,0))continue;
      let p=Wc.p;for(const fb of W.forceBands)if(y2>fb.y1&&y1<fb.y2)p=1;
      if(rnd()>p)continue;
      const forb=[];
      for(let k=0;k<=8;k++){const yy=y1+(y2-y1)*k/8;for(const P of W.lanes){if(P!==W.main&&(yy>P.ys[0]+30||yy<P.ys[P.n-1]-30))continue;const xx=xAtY(P,yy);forb.push([xx-half-16,xx+half+16]);}}
      forb.sort((a,b)=>a[0]-b[0]);
      const merged=[];for(const iv of forb){const m=merged[merged.length-1];if(m&&iv[0]<=m[1])m[1]=Math.max(m[1],iv[1]);else merged.push([iv[0],iv[1]]);}
      let cur=x1;const pieces=[];
      for(const iv of merged){if(iv[1]<=cur)continue;if(iv[0]>cur)pieces.push([cur,Math.min(iv[0],x2)]);cur=Math.max(cur,iv[1]);if(cur>=x2)break;}
      if(cur<x2)pieces.push([cur,x2]);
      for(const[a,b]of pieces){if(b-a<170)continue;const pa={x1:a+3,y1:y1+3,x2:b-3,y2:y2-3};
        if(inRect(pa,W.home.x,W.home.y,50)||inRect(pa,72,110,70))continue; // your own place stays yours
        addPasture(W,pa,rnd);}
    }
  }
  // cross fences
  const span=(y)=>{const xc=xAtY(W.main,y);let L=xc-half-40,R=xc+half+40;
    for(const pa of W.pastures){if(y<pa.y1||y>pa.y2)continue;if(pa.x2<=xc&&pa.x2>L-200)L=Math.max(L,pa.x2);if(pa.x1>=xc&&pa.x1<R+200)R=Math.min(R,pa.x1);}
    // find the nearest pasture edges actually bounding the lane
    let l2=-1e9,r2=1e9;for(const pa of W.pastures){if(y<pa.y1||y>pa.y2)continue;if(pa.x2<=xc+2)l2=Math.max(l2,pa.x2);if(pa.x1>=xc-2)r2=Math.min(r2,pa.x1);}
    return[l2>-1e8?l2-1:L,r2<1e8?r2+1:R];};
  if(W.D.fenceCut){const xc=xAtY(W.main,W.crossY),xa=xAtY(W.alt,W.crossY);W.crossFence=addFence(W,xa+half+18,W.crossY,xc+W.corr+300,W.crossY,'wire',{cut:false,cuttable:true});}
  if(W.D.blocked){const xc0=xAtY(W.main,W.blockY);W.blockFence=addFence(W,xc0-W.corr-300,W.blockY,xc0+W.corr+300,W.blockY,'wire',{block:true});
    const xc=xAtY(W.main,W.blockY);W.signs.push({x:xc+46,y:W.blockY+20,lines:['POSTED','Caledonia Land','& Cattle Co., Ltd.'],small:true});W.extras.push({type:'gate',x:xc,y:W.blockY});}
}
function addPasture(W,pa,rnd){
  pa.seed=(rnd()*1e9)|0;W.pastures.push(pa);
  addFence(W,pa.x1,pa.y1,pa.x2,pa.y1,'wire');addFence(W,pa.x2,pa.y1,pa.x2,pa.y2,'wire');addFence(W,pa.x2,pa.y2,pa.x1,pa.y2,'wire');addFence(W,pa.x1,pa.y2,pa.x1,pa.y1,'wire');
  const w=pa.x2-pa.x1,h=pa.y2-pa.y1;
  if(rnd()<0.55&&w>140&&h>140){const m={type:'windmill',x:pa.x1+50+rnd()*(w-100),y:pa.y1+50+rnd()*(h-100),r:16,solid:6,seed:pa.seed+3,ph:rnd()*TAU};W.windmills.push(m);addObj(W,m);}
  if(rnd()<0.4){pa.cows=[];const n=3+((rnd()*6)|0),cx=pa.x1+40+rnd()*(w-80),cy=pa.y1+40+rnd()*(h-80);for(let i=0;i<n;i++)pa.cows.push({x:clamp(cx+(rnd()-0.5)*90,pa.x1+12,pa.x2-12),y:clamp(cy+(rnd()-0.5)*90,pa.y1+12,pa.y2-12),a:rnd()*TAU,coat:(rnd()*COATS.length)|0});}
  // a posted sign on the side facing the trail

function genFeatures(W){

        if(r()<(key==='blackland'?0.22:0.07)){const[x,y]=rp();put({type:key==='blackland'?'pecan':'oak',x,y,r:18+r()*12,solid:5.5,seed:(r()*1e9)|0},80);}
        if(r()<0.04){const[x,y]=rp();put({type:'rock',x,y,r:5+r()*7,solid:5,seed:(r()*1e9)|0},70);}

        if(r()<0.04){const[x,y]=rp();put({type:'pond',x,y,r:24+r()*18,seed:(r()*1e9)|0,water:true},80);}
        if(r()<0.1){const[x,y]=rp();put({type:'flowers',x,y,r:30+r()*40,seed:(r()*1e9)|0,kind:'coneflower'},0);}

}
/* ================= Terrain tiles (pre-rendered, cached) ================= */
const BLIST=BIOME_KEYS.map(k=>BIOMES[k]);
const TILES={cache:new Map(),max:72,scale:2,low:null,lowCtx:null,grain:null,M:68};
function tilesInit(){
  TILES.low=document.createElement('canvas');TILES.low.width=TILES.low.height=66;TILES.lowCtx=TILES.low.getContext('2d');
  const M=TILES.M;TILES.Ai=new Uint8Array(M*M);TILES.Bi=new Uint8Array(M*M);TILES.Tt=new Float32Array(M*M);TILES.Tz=new Float32Array(M*M);TILES.H=new Float32Array(M*M);
  const gc=document.createElement('canvas');gc.width=gc.height=256;const gg=gc.getContext('2d');const id=gg.createImageData(256,256);const r=mulberry32(99);
  for(let i=0;i<id.data.length;i+=4){const v=r();const c=v<0.5?0:255;id.data[i]=id.data[i+1]=id.data[i+2]=c;id.data[i+3]=Math.pow(Math.abs(v-0.5)*2,2.2)*235;}
  gg.putImageData(id,0,0);TILES.grain=gc;
}
function clearTiles(){TILES.cache.clear();}
function tileKey(tx,ty){return (tx+5000)*20000+(ty+10000);}
function getTile(tx,ty){const k=tileKey(tx,ty),t=TILES.cache.get(k);if(t){TILES.cache.delete(k);TILES.cache.set(k,t);}return t;}
function makeTile(W,tx,ty){
  const cv=renderTile(W,tx,ty);const k=tileKey(tx,ty);TILES.cache.set(k,cv);
  while(TILES.cache.size>TILES.max){const first=TILES.cache.keys().next().value;TILES.cache.delete(first);}
  return cv;
}

const _c1=[0,0,0],_c2=[0,0,0];
function biomeCol(b,m,dd,mic,slope,out){
  let r=b.g1C[0]+(b.g2C[0]-b.g1C[0])*m,g=b.g1C[1]+(b.g2C[1]-b.g1C[1])*m,bl=b.g1C[2]+(b.g2C[2]-b.g1C[2])*m;
  const sa=sstep(b.soilT-0.14,b.soilT+0.14,dd)*b.soilAmt;
  r+=(b.soilC[0]-r)*sa;g+=(b.soilC[1]-g)*sa;bl+=(b.soilC[2]-bl)*sa;
  if(b.rockC){const ra=sstep(0.26,0.6,slope+dd*0.12)*0.78;r+=(b.rockC[0]-r)*ra;g+=(b.rockC[1]-g)*ra;bl+=(b.rockC[2]-bl)*ra;}
  const k=1+mic*0.07;out[0]=r*k;out[1]=g*k;out[2]=bl*k;
}
function riverColor(W,x,y,ad,hw,c){
  if(ad<hw){
    const depth=1-ad/hw,isl=W.nC.n2(x*0.0105+5,y*0.032)+W.nB.n2(x*0.03,y*0.05)*0.28;
    if(isl>0.44&&depth<0.9){const k=sstep(0.44,0.52,isl);const wet=[176,136,100],sand=[214,188,146];c[0]=lerp(wet[0],sand[0],k);c[1]=lerp(wet[1],sand[1],k);c[2]=lerp(wet[2],sand[2],k);return;}
    const t=Math.pow(depth,0.7),st=W.nB.n2(x*0.012,y*0.09)*0.5+0.5,band=sstep(0.55,0.8,W.nC.n2(x*0.004+9,y*0.05)*0.5+0.5);
    let r=lerp(156,98,t),g=lerp(92,52,t),b=lerp(60,40,t);
    r+=st*12+band*30;g+=st*8+band*26;b+=st*6+band*28;
    c[0]=r*0.9+118*0.1;c[1]=g*0.9+128*0.1;c[2]=b*0.9+138*0.1;return;
  }
  if(ad<hw+95){
    const rip=W.nB.n2(x*0.09,y*0.03)*0.5+0.5,edge=sstep(hw+14,hw,ad);
    c[0]=214+rip*10-edge*44;c[1]=188+rip*8-edge*52;c[2]=146+rip*6-edge*48;return;
  }

  c[0]=lerp(clay[0],c[0],k);c[1]=lerp(clay[1],c[1],k);c[2]=lerp(clay[2],c[2],k);
}

function renderTile(W,tx,ty){

      _c1[0]+=(dust[0]-_c1[0])*tr;_c1[1]+=(dust[1]-_c1[1])*tr;_c1[2]+=(dust[2]-_c1[2])*tr;}

  for(const pa of W.pastures)if(pa.x2>x0-20&&pa.x1<x0+TILE+20&&pa.y2>y0-20&&pa.y1<y0+TILE+20){const w=pa.x2-pa.x1,h=pa.y2-pa.y1;
    g.fillStyle='rgba(118,128,72,0.09)';g.fillRect(pa.x1,pa.y1,w,h);g.strokeStyle='rgba(160,136,98,0.34)';g.lineWidth=4.5;g.strokeRect(pa.x1+8,pa.y1+8,w-16,h-16);

  for(const o of objs)if(o.type==='fence')drawFence(g,o);
  for(const b of blds)b.type==='bldg'?drawBuilding(g,b):drawWindmillBase(g,b);
  for(const e of W.extras)if(e.x>x0-80&&e.x<x0+TILE+80&&e.y>y0-80&&e.y<y0+TILE+80)drawExtraHigh(g,e);
  return cv;
}

/* grass texture: short blades in clumps, batched by biome */
function drawTufts(g,W,x0,y0){
  const paths=new Map();
  const get=(b)=>{let p=paths.get(b.idx);if(!p){p={b,dk:new Path2D(),lt:new Path2D(),sp:new Path2D()};paths.set(b.idx,p);}return p;};
  const m=8,gx0=Math.floor((x0-m)/CELL),gx1=Math.floor((x0+TILE+m)/CELL),gy0=Math.floor((y0-m)/CELL),gy1=Math.floor((y0+TILE+m)/CELL);
  for(let gy=gy0;gy<=gy1;gy++)for(let gx=gx0;gx<=gx1;gx++){
    const r=mulberry32(seedFrom(gx,gy,1234));
    for(let i=0;i<88;i++){
      const x=gx*CELL+r()*CELL,y=gy*CELL+r()*CELL,ra=r(),rb=r(),rc=r();
      if(x<x0-m||x>x0+TILE+m||y<y0-m||y>y0+TILE+m)continue;
      if(W.river){const ad=Math.abs(y-riverY(W.river,x)),hw=riverHW(W.river,x);if(ad<hw+4)continue;if(ad<hw+95&&ra>0.12)continue;}
      const b=biomeKeyAt(W,x,y);const p=get(b);
      if(ra>b.tufts*0.62){p.sp.moveTo(x+0.8,y);p.sp.arc(x,y,0.5+rb*0.7,0,TAU);continue;}
      const tall=b.tall||0,n=3+((rb*3)|0)+(tall>0.5?2:0),base=-PI/2-0.25-tall*0.25;
      for(let k=0;k<n;k++){const a=base+(((k*0.61+rc)%1)-0.5)*(1.9-tall*0.6),l=(2.2+((k*0.37+rb)%1)*2.8)*(1+tall*0.9);
        p.dk.moveTo(x,y);p.dk.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);
        if(k<2){p.lt.moveTo(x-0.6,y-0.5);p.lt.lineTo(x-0.6+Math.cos(a-0.2)*l*0.8,y-0.5+Math.sin(a-0.2)*l*0.8);}}
    }
  }
  g.lineCap='round';
  for(const p of paths.values()){
    g.strokeStyle=css(p.b.tuftC,0.55);g.lineWidth=0.95;g.stroke(p.dk);
    g.strokeStyle=css(p.b.tuftHiC,0.42);g.lineWidth=0.7;g.stroke(p.lt);
    g.fillStyle=css(p.b.soilC.map(v=>v*0.78),0.45);g.fill(p.sp);
  }
}

/* the braided cattle paths along the trail */
function trailIndexRange(P,yTop,yBot){
  let lo=0,hi=P.n-1;while(lo<hi){const m=(lo+hi)>>1;if(P.ys[m]>yBot)lo=m+1;else hi=m;}const i0=lo;
  lo=0;hi=P.n-1;while(lo<hi){const m=(lo+hi+1)>>1;if(P.ys[m]<yTop)hi=m-1;else lo=m;}const i1=lo;
  return[Math.max(0,i0-1),Math.min(P.n-1,i1+1)];
}
function drawTrailPaths(g,W,x0,y0){
  g.lineCap='butt';g.lineJoin='round';
  const np=W.D.crowd?10:W.D.phase===3?5:8;
  for(const P of W.trails){
    const[i0,i1]=trailIndexRange(P,y0-120,y0+TILE+120);if(i0>=i1)continue;
    const isAlt=P!==W.main;
    for(let k=0;k<np;k++){
      const base=(k/(np-1)-0.5)*(W.D.crowd?150:120),lw=1.5+((k*0.37)%1)*1.2,ph=k*7.13+(isAlt?50:0);
      let px=0,py=0;
      for(let i=i0;i<=i1;i++){
        const s=P.cum[i]+(isAlt?999:0);
        const o=base+W.nA.n2(s*0.011+ph,k*3.1)*20;
        const x=P.xs[i]+P.nx[i]*o,y=P.ys[i]+P.ny[i]*o;
        if(i>i0){const mx=(px+x)/2,my=(py+y)/2;
          if(mx>x0-40&&mx<x0+TILE+40&&my>y0-40&&my<y0+TILE+40){
            const b=biomeKeyAt(W,mx,my);
            const fade=sstep(0,0.25,Math.abs(W.nB.n2(s*0.02+ph,k)));
            g.strokeStyle=css(b.pathC,0.36*fade+0.06);g.lineWidth=lw;g.beginPath();g.moveTo(px,py);g.lineTo(x,y);g.stroke();
            g.strokeStyle=css(b.tuftHiC,0.13*fade);g.lineWidth=0.7;g.beginPath();g.moveTo(px-0.9,py-0.9);g.lineTo(x-0.9,y-0.9);g.stroke();
          }}
        px=x;py=y;
      }
    }
  }
}

function drawCreeks(g,W,x0,y0){
  for(const c of W.creeks){
    if(c.y0<y0-220||c.y0>y0+TILE+220)continue;
    const pts=[];for(let x=Math.floor((x0-30)/6)*6;x<=x0+TILE+30;x+=6)pts.push(x,creekY(c,x));
    const path=(dy)=>{g.beginPath();g.moveTo(pts[0],pts[1]+dy);for(let i=2;i<pts.length;i+=2)g.lineTo(pts[i],pts[i+1]+dy);};
    g.lineCap='butt';g.lineJoin='round';
    path(2);g.strokeStyle='rgba(84,70,46,0.35)';g.lineWidth=c.hw*2+20;g.stroke();
    path(0);g.strokeStyle='rgba(110,92,62,0.55)';g.lineWidth=c.hw*2+12;g.stroke();
    path(0);g.strokeStyle='rgba(70,72,56,0.7)';g.lineWidth=c.hw*2+4;g.stroke();
    path(0);g.strokeStyle='#557d80';g.lineWidth=c.hw*2;g.stroke();
    path(-c.hw*0.2);g.strokeStyle='rgba(128,170,165,0.6)';g.lineWidth=c.hw*1.1;g.stroke();
    path(-c.hw*0.45);g.strokeStyle='rgba(220,235,225,0.25)';g.lineWidth=1;g.stroke();
    // pebbles on the banks
    const r=mulberry32(Math.floor(x0*7+c.s));g.fillStyle='rgba(205,195,170,0.55)';
    for(let i=0;i<pts.length;i+=4){if(r()<0.5){const side=r()<0.5?-1:1;circle(g,pts[i]+r()*4,pts[i+1]+side*(c.hw+3+r()*4),0.8+r()*1.2);}}
  }
}
function drawRiverDetail(g,W,x0,y0){
  const rv=W.river;if(rv.y0<y0-420||rv.y0>y0+TILE+420)return;
  g.lineCap='round';
  const r=mulberry32(tileKey(Math.floor(x0/TILE),Math.floor(y0/TILE)));
  // bank lines (cut banks) and wet edge
  for(const side of[-1,1]){
    g.beginPath();let first=true;
    for(let x=Math.floor((x0-20)/6)*6;x<=x0+TILE+20;x+=6){const y=riverY(rv,x)+side*(riverHW(rv,x)+96);first?g.moveTo(x,y):g.lineTo(x,y);first=false;}
    g.strokeStyle='rgba(120,60,36,0.45)';g.lineWidth=3;g.stroke();
    g.beginPath();first=true;
    for(let x=Math.floor((x0-20)/6)*6;x<=x0+TILE+20;x+=6){const y=riverY(rv,x)+side*(riverHW(rv,x)+2);first?g.moveTo(x,y):g.lineTo(x,y);first=false;}
    g.strokeStyle='rgba(96,60,40,0.4)';g.lineWidth=2;g.stroke();
  }
  // sand ripples
  g.strokeStyle='rgba(170,140,100,0.3)';g.lineWidth=0.8;
  for(let i=0;i<60;i++){const x=x0+r()*TILE,side=r()<0.5?-1:1,y=riverY(rv,x)+side*(riverHW(rv,x)+12+r()*78);if(y<y0-4||y>y0+TILE+4)continue;g.beginPath();g.moveTo(x-5,y);g.quadraticCurveTo(x,y-1.6,x+5,y);g.stroke();}

/* ground-level objects */
function drawGround(g,o,W){
  const rr=mulberry32(o.seed),r=o.r;
  switch(o.type){
    case 'flowers':{
      const cols=o.kind==='bluebonnet'?['#3e57a8','#5a6fc0','#4a62b4','#e9e6f2']:o.kind==='paintbrush'?['#d0553a','#e07a46','#c44a35','#e8b04a']:o.kind==='sunflower'?['#e7b52c','#f0c440','#d9a020','#5a3a1a']:['#b065a6','#c27bb4','#9c4f92','#e6c9df'];
      for(let i=0;i<70;i++){const a=rr()*TAU,dd=Math.pow(rr(),0.6)*r;const x=o.x+Math.cos(a)*dd,y=o.y+Math.sin(a)*dd*0.8;g.fillStyle=cols[(rr()*cols.length)|0];circle(g,x,y,0.9+rr()*0.9);}
      break;}
    case 'wallow':{g.fillStyle='rgba(70,90,40,0.28)';blob(g,o.x,o.y,r*1.25,rr,10,0.15);g.fillStyle='rgba(120,100,70,0.45)';blob(g,o.x+1,o.y+1,r*0.75,rr,9,0.2);g.fillStyle='rgba(90,110,60,0.35)';blob(g,o.x-r*0.2,o.y-r*0.2,r*0.4,rr,7,0.3);break;}
    case 'cracks':{g.strokeStyle='rgba(120,98,66,0.5)';g.lineWidth=0.7;for(let i=0;i<26;i++){const a=rr()*TAU,dd=rr()*r;let x=o.x+Math.cos(a)*dd,y=o.y+Math.sin(a)*dd;g.beginPath();g.moveTo(x,y);for(let k=0;k<3;k++){x+=(rr()-0.5)*14;y+=(rr()-0.5)*14;g.lineTo(x,y);}g.stroke();}break;}
    case 'cactus':{const n=3+((rr()*5)|0);for(let i=0;i<n;i++){const a=rr()*TAU,dd=rr()*r*0.6,px=o.x+Math.cos(a)*dd,py=o.y+Math.sin(a)*dd,pr=2.4+rr()*2.4,an=rr()*PI;
        g.fillStyle='rgba(40,50,30,0.3)';ell(g,px+1,py+1.2,pr,pr*0.72,an);g.fillStyle='#5f7f62';ell(g,px,py,pr,pr*0.72,an);g.fillStyle='#86a580';ell(g,px-0.5,py-0.5,pr*0.7,pr*0.48,an);
        g.fillStyle='rgba(225,230,200,0.5)';ell(g,px-pr*0.3,py-pr*0.3,pr*0.3,pr*0.18,an);if(rr()<0.35){g.fillStyle='#a3365c';circle(g,px+pr*0.7,py-pr*0.5,1.1);}}break;}
    case 'rock':{
      if(o.ledge){// a broken limestone ledge: a curved chain of flat stones
        const n=4+((rr()*4)|0),len=r*3.2,bend=(rr()-0.5)*0.9,ang=o.rot;
        for(let i=0;i<n;i++){const t=i/(n-1)-0.5,px=o.x+Math.cos(ang)*t*len-Math.sin(ang)*bend*len*(0.25-t*t),py=o.y+Math.sin(ang)*t*len+Math.cos(ang)*bend*len*(0.25-t*t);const sr=r*(0.32+rr()*0.28);
          g.fillStyle='rgba(66,56,40,0.36)';blobE(g,px+1.4,py+2,sr*1.25,sr*0.9,rr,8,0.25);g.fillStyle='#c4ba9f';blobE(g,px,py,sr*1.2,sr*0.85,rr,8,0.28);g.fillStyle='rgba(236,230,210,0.55)';blobE(g,px-sr*0.25,py-sr*0.25,sr*0.6,sr*0.38,rr,6,0.3);}
      }
      else{g.fillStyle='rgba(50,42,30,0.32)';blob(g,o.x+r*0.28,o.y+r*0.34,r,rr,8,0.28);g.fillStyle='#cfc7b1';blob(g,o.x,o.y,r,rr,8,0.3);g.fillStyle='rgba(255,252,240,0.4)';blob(g,o.x-r*0.25,o.y-r*0.25,r*0.5,rr,6,0.3);
        g.strokeStyle='rgba(100,90,70,0.4)';g.lineWidth=0.6;g.beginPath();g.moveTo(o.x-r*0.4,o.y+r*0.1);g.lineTo(o.x+r*0.1,o.y-r*0.05);g.lineTo(o.x+r*0.45,o.y+r*0.25);g.stroke();}

function drawPond(g,o){

function drawField(g,f){

  g.fillStyle=soil;g.fillRect(f.x1,f.y1,w,h);

  const line=(t,a0,a1)=>{g.beginPath();if(along){g.moveTo(f.x1+a0,f.y1+t);g.lineTo(f.x1+a1,f.y1+t);}else{g.moveTo(f.x1+t,f.y1+a0);g.lineTo(f.x1+t,f.y1+a1);}g.stroke();};
  if(f.crop==='wheat'){g.fillStyle='#c6a457';g.fillRect(f.x1,f.y1,w,h);g.lineWidth=1.6;for(let t=2;t<span;t+=5){g.strokeStyle=rr()<0.5?'rgba(170,135,62,0.55)':'rgba(222,196,120,0.5)';line(t,0,len);}
    g.fillStyle='rgba(120,95,40,0.18)';for(let i=0;i<20;i++)ell(g,f.x1+rr()*w,f.y1+rr()*h,10+rr()*30,6+rr()*14);}
  else{g.strokeStyle='rgba(60,45,30,0.5)';g.lineWidth=1.2;for(let t=3;t<span;t+=7)line(t,0,len);

      if(f.crop==='cotton'&&rr()<0.55){g.fillStyle='#f3efe4';circle(g,x+(rr()-0.5)*2,y+(rr()-0.5)*2,0.9+rr()*0.6);}}}

}

function blobE(g,x,y,rx,ry,rr,n,j){const pts=[];for(let i=0;i<n;i++){const a=i/n*TAU+rr()*0.3,k=1+(rr()-0.5)*j*2;pts.push(x+Math.cos(a)*rx*k,y+Math.sin(a)*ry*k);}
  g.beginPath();g.moveTo((pts[2*n-2]+pts[0])/2,(pts[2*n-1]+pts[1])/2);for(let i=0;i<n;i++){const px=pts[2*i],py=pts[2*i+1],qx=pts[(2*i+2)%(2*n)],qy=pts[(2*i+3)%(2*n)];g.quadraticCurveTo(px,py,(px+qx)/2,(py+qy)/2);}g.closePath();g.fill();}
/* trees */
const TREE_TYPES={oak:1,postoak:1,pecan:1,cottonwood:1,juniper:1,cypress:1,mesquite:1,deadmesq:1,thicket:1};
function treeShadow(g,o){
  const r=o.type==='thicket'?o.r*0.95:o.r;const k=o.type==='mesquite'||o.type==='deadmesq'?0.45:o.type==='thicket'?0.6:1;
  const sx=o.x+r*0.4,sy=o.y+r*0.5;const gr=g.createRadialGradient(sx,sy,r*0.3,sx,sy,r*1.08);
  gr.addColorStop(0,`rgba(26,32,18,${0.42*k})`);gr.addColorStop(1,'rgba(26,32,18,0)');g.fillStyle=gr;circle(g,sx,sy,r*1.08);
}
function drawTree(g,o){
  const rr=mulberry32(o.seed),r=o.r,x=o.x,y=o.y;
  switch(o.type){
    case 'oak':case 'postoak':case 'pecan':case 'cottonwood':{

      for(let i=0;i<8;i++){const a=rr()*TAU,dd=rr()*r*0.5;g.fillStyle=pal[1];circle(g,x+Math.cos(a)*dd-r*0.06,y+Math.sin(a)*dd-r*0.06,r*(0.36+rr()*0.2));}
      for(let i=0;i<6;i++){const a=PI*1.25+(rr()-0.5)*1.5,dd=r*(0.2+rr()*0.38);g.fillStyle=pal[2];circle(g,x+Math.cos(a)*dd,y+Math.sin(a)*dd,r*(0.17+rr()*0.13));}
      g.fillStyle=pal[3];for(let i=0;i<12;i++){const a=PI*1.25+(rr()-0.5)*2.3,dd=r*(0.2+rr()*0.62);circle(g,x+Math.cos(a)*dd,y+Math.sin(a)*dd,0.7+rr()*1.3);}
      g.fillStyle='rgba(20,30,14,0.35)';for(let i=0;i<6;i++){const a=PI*0.25+(rr()-0.5)*1.6,dd=r*(0.4+rr()*0.45);circle(g,x+Math.cos(a)*dd,y+Math.sin(a)*dd,r*(0.1+rr()*0.08));}

    case 'juniper':case 'cypress':{
      const c0=o.type==='juniper'?'#2c4234':'#3c5a3a',c1=o.type==='juniper'?'#435e47':'#5c7c4e',c2=o.type==='juniper'?'rgba(150,180,150,0.55)':'rgba(170,200,140,0.55)';

      for(let i=0;i<7;i++){const a=rr()*TAU,dd=rr()*r*0.45;g.fillStyle=c1;circle(g,x+Math.cos(a)*dd-r*0.12,y+Math.sin(a)*dd-r*0.12,r*(0.3+rr()*0.18));}
      g.fillStyle=c2;for(let i=0;i<7;i++){const a=PI*1.25+(rr()-0.5)*1.8,dd=r*(0.15+rr()*0.55);circle(g,x+Math.cos(a)*dd,y+Math.sin(a)*dd,0.7+rr()*1.1);}
      break;}
    case 'mesquite':case 'deadmesq':{
      const dead=o.type==='deadmesq';g.strokeStyle=dead?'#7c6d5b':'#4b3c2b';g.lineWidth=dead?1:1.1;g.lineCap='round';
      for(let i=0;i<5;i++){const a=rr()*TAU;g.beginPath();g.moveTo(x,y);const mx=x+Math.cos(a+0.4)*r*0.45,my=y+Math.sin(a+0.4)*r*0.45;g.quadraticCurveTo(mx,my,x+Math.cos(a)*r*0.9,y+Math.sin(a)*r*0.9);g.stroke();
        if(dead){g.beginPath();g.moveTo(mx,my);g.lineTo(mx+Math.cos(a-0.9)*r*0.35,my+Math.sin(a-0.9)*r*0.35);g.stroke();}}

  G.others=[];if(G.D.crowd){for(const side of[-1,1]){const q=polyAt(W.main,SEG_LEN*1.3);G.others.push({x:q.x+side*640,y:q.y-300*side,vy:-24});}}
  setupTriggers();
  G.cam.x=H.x;G.cam.y=H.y-40;G.cam.z=1;
  initClouds();
}
function spawnHerd(){

    G.cows.push({id:i,x:p.x+Math.cos(a)*d*1.05,y:p.y+Math.sin(a)*d*0.85,vx:0,vy:0,ang:-PI/2+(r()-0.5)*1.4,coat:COATS[ci],head:COW_HEAD,state:'herd',
      gz:r()*3,grazing:false,wa:r()*TAU,quitter:r()<0.14,quitT:0,qx:0,qy:0,panic:0,spookT:0,spx:0,spy:0,step:r()*10,size:0.9+r()*0.2,horn:0.85+r()*0.35,
      inWater:false,entryX:null,dc:0,drank:false,penX:0,penY:0,bed:0,given:false,wt:0});

function spawnRiders(){
  const H=G.herd;
  const roles=CREW_ROLES[CREW_N];
  G.riders=CREW.filter(c=>roles.includes(c.role)).map((c,i)=>({...c,crew:true,x:H.x+(i-1.5)*60,y:H.y+(c.role==='point'?-110:c.role==='drag'?120:0),vx:0,vy:0,ang:-PI/2,step:0,max:122,orbit:i*TAU/Math.max(1,roles.length),dir:i%2?1:-1}));

// which posts the hands are covering (not the one you are riding)
function crewCover(){G.hasDrag=G.riders.some(r=>r.role==='drag');G.swings=G.riders.filter(r=>r.role==='swingL'||r.role==='swingR').length;}
// you take the post nobody else is riding
function assignPlayerRole(){const P=G.player;if(!P)return;const taken=G.riders.map(r=>r.role);P.role=['drag','swingL','swingR','point'].find(r=>!taken.includes(r))||null;}
// take over another rider: you swap places, horses and posts; the hand you left keeps working your old post
const SWAP_KEYS=['x','y','vx','vy','ang','step','hat','brim','band','shirt','horse','blanket','role','name'];
function switchTo(r){
  const P=G.player;if(!r||r===P||!SWITCH_ON||!P.role||!r.role)return;
  for(const k of SWAP_KEYS){const t=P[k];P[k]=r[k];r[k]=t;}
  P.hasTarget=false;r.orbit=Math.random()*TAU;crewCover();INPUT.down=false;
  G.switchFx={x:P.x,y:P.y,t:0};sfx('click');
  if(G.state==='day')callout('Riding '+(ROLE_LABEL[P.role]||'free').toLowerCase()+'. Your hands cover the other posts.',1800);
}
function switchToRole(role){const r=G.riders.find(q=>q.role===role);if(r)switchTo(r);}
function switchCycle(){const posts=[G.player,...G.riders].filter(q=>q.role).sort((a,b)=>ROLE_ORDER.indexOf(a.role)-ROLE_ORDER.indexOf(b.role));if(posts.length<2)return;const i=posts.indexOf(G.player);switchTo(posts[(i+1)%posts.length]);}
const alive=c=>c.state!=='lost';
function headAlive(){let s=0;for(const c of G.cows)if(c.state!=='lost')s+=c.head;return s;}
function headPenned(){let s=0;for(const c of G.cows)if(c.state==='penned')s+=c.head;return s;}
function priceOn(day){const D=G.D;return D.market*Math.max(0.35,1-D.slide*(day-1));}

/* ---- herd bookkeeping ---- */
const _ds=[];
function updateHerdStats(){
  const H=G.herd,cs=G.cows,W=G.W;
  let n=0,mx=0,my=0;
  for(const c of cs){if(c.state==='lost'||c.state==='penned'||c.given)continue;mx+=c.x;my+=c.y;n++;}
  if(!n){for(const c of cs){if(c.state==='penned'){mx+=c.x;my+=c.y;n++;}}if(!n){H.count=0;return;}}
  mx/=n;my/=n;
  _ds.length=0;for(const c of cs){if(c.state==='lost'||c.state==='penned'||c.given)continue;_ds.push(hyp(c.x-mx,c.y-my));}
  _ds.sort((a,b)=>a-b);const med=_ds.length?_ds[_ds.length>>1]:60;
  const R=clamp(med*2.3+34,150,285);
  let n2=0,x2=0,y2=0;for(const c of cs){if(c.state==='lost'||c.state==='penned'||c.given)continue;if(hyp(c.x-mx,c.y-my)<R){x2+=c.x;y2+=c.y;n2++;}}
  if(n2){mx=x2/n2;my=y2/n2;}
  H.x=mx;H.y=my;H.R=R;H.count=n2;
  for(const c of cs){if(c.state==='lost'||c.given)continue;const d=hyp(c.x-mx,c.y-my);c.dc=d;
    if(c.state==='penned')continue;
    if(c.state==='herd'&&d>R+32)c.state='stray';else if(c.state==='stray'&&d<R-12)c.state='herd';}
  const pm=polyProject(W.main,mx,my,H.hintM,26);H.hintM=pm.i;
  let branch=W.main,proj=pm,rem=W.len-pm.s;
  if(W.alt){const pa=polyProject(W.alt,mx,my,H.hintA,26);H.hintA=pa.i;
    const preferAlt=G.flags.goAround&&pm.s>W.altA-260&&pm.s<W.altB;
    if(preferAlt||(pa.d<pm.d-8&&pa.s>4&&pa.s<W.alt.len-4)){branch=W.alt;proj=pa;rem=(W.alt.len-pa.s)+(W.len-W.altB);}}
  H.branch=branch;H.ps=proj.s;H.rem=rem;H.s=W.len-rem;
  const tp=branchPoint(branch,proj.s+70);H.tx=tp.tx;H.ty=tp.ty;H.nx=-H.ty;H.ny=H.tx;
  let f=-1e9,r=1e9,l=1e9,rt=-1e9;
  for(const c of cs){if(c.state!=='herd'||c.given)continue;const px=c.x-mx,py=c.y-my,a=px*H.tx+py*H.ty,b=px*H.nx+py*H.ny;if(a>f)f=a;if(a<r)r=a;if(b<l)l=b;if(b>rt)rt=b;}
  if(f<-1e8){f=40;r=-40;l=-40;rt=40;}
  H.front=f;H.rear=r;H.left=l;H.right=rt;
}
function branchPoint(P,s){const W=G.W;if(P===W.alt&&s>W.alt.len)return polyAt(W.main,W.altB+(s-W.alt.len));return polyAt(P,s);}
function cowTarget(c){
  const H=G.herd,P=H.branch||G.W.main;
  const pr=polyProject(P,c.x,c.y,clamp(H.hintM>=0&&P===G.W.main?H.hintM:H.hintA,0,P.n-2),18);
  return branchPoint(P,pr.s+150);
}

/* ---- triggers along the trail ---- */
function setupTriggers(){
  const W=G.W,T=[];
  if(W.alt&&W.altKind==='water')T.push({s:W.altA-330,fn:()=>firstTime('fork')});
  if(W.toll)T.push({s:W.toll.s-150,fn:tollCard});
  if(W.crossFence)T.push({s:W.altA-150,fn:fenceCard});
  if(W.blockFence)T.push({s:W.blockS-230,fn:blockCard});
  G.trig=T;
}
function checkTriggers(){const H=G.herd;for(const t of G.trig){if(!t.done&&H.s>=t.s){t.done=true;t.fn();return;}}}

/* ---- daily threats ---- */
function scheduleDay(){
  G.events=[];
  const b=biomeOfS(G.W,G.herd.s+SEG_LEN*0.4);
  let table=(THREATS[b.key]||['strays']).slice();
  if(G.D.phase===3&&!HARD)table=table.map(t=>t==='wolves'?'strays':t);
  if(G.D.phase===3&&HARD)table.push('rustlers','rustlers','spook');
  if(G.D.crowd)table.push('rustlers','rustlers');
  if(G.stormMorning)table.push('spook');
  let n=1+(Math.random()<0.45+G.di*0.07?1:0);if(HARD)n+=1;
  if(G.di===0&&G.day===1){n=1;table=['strays'];}
  if(G.di===0&&G.day===2){n=1;table=['wolves'];}
  const times=[];for(let i=0;i<n;i++)times.push(G.dayLen*(0.2+Math.random()*0.52));times.sort((a,b)=>a-b);
  for(let i=1;i<times.length;i++)if(times[i]-times[i-1]<8)times[i]=times[i-1]+8;
  for(const t of times)G.events.push({t,type:table[(Math.random()*table.length)|0],done:false});
}
function runEvents(){
  if(G.mode!=='trail')return;
  for(const e of G.events){if(e.done||G.t<e.t)continue;e.done=true;
    // hard mode: wolves and rustlers often come at both flanks at once
    const s1=Math.random()<0.5?-1:1,both=HARD&&Math.random()<0.6;
    if(e.type==='wolves'){spawnWolves(s1);if(both)spawnWolves(-s1);}
    else if(e.type==='rustlers'){spawnRustlers(s1);if(both)spawnRustlers(-s1);}else if(e.type==='strays')spawnQuitters();else if(e.type==='spook')spawnSpook();}
}
function spawnDist(){const v=G.view;if(!v)return 520;return Math.max(430,0.62*Math.max(v.x1-v.x0,v.y1-v.y0));}
function spawnWolves(forceSide){
  const H=G.herd,side=forceSide||(Math.random()<0.5?-1:1),d=spawnDist();
  const n=G.di===0&&G.day<4?2:2+(Math.random()<0.45?1:0);
  const bx=H.x-H.tx*d*0.55+H.nx*side*d*0.75,by=H.y-H.ty*d*0.55+H.ny*side*d*0.75;
  for(let i=0;i<n;i++)G.wolves.push({x:bx+(Math.random()-0.5)*80,y:by+(Math.random()-0.5)*80,vx:0,vy:0,ang:0,step:0,state:'stalk',target:null,life:0,bite:0,acc:0,fade:0});
  sfx('howl');firstTime('wolves');
}
function spawnRustlers(forceSide){
  const H=G.herd,side=forceSide||(Math.random()<0.5?-1:1),d=spawnDist();
  const grp={side,ex:0,ey:0,state:'approach',cut:[]};
  const bx=H.x+H.nx*side*d*0.95+H.tx*d*0.2,by=H.y+H.ny*side*d*0.95+H.ty*d*0.2;
  for(let i=0;i<2;i++)G.rustlers.push({x:bx+i*30,y:by+i*24,vx:0,vy:0,ang:0,step:0,grp,i,hat:'#1e1b18',brim:'#2e2925',band:'#7c1f1f',shirt:'#3a3330',horse:i?'#2a2522':'#4a2f1e',fade:0});
  firstTime('rustlers');
}
function spawnQuitters(){
  const H=G.herd,W=G.W;
  const cand=G.cows.filter(c=>c.state==='herd'&&!c.given).sort((a,b)=>b.dc-a.dc).slice(0,8);
  shuffle(cand);const n=2+(Math.random()<0.5?1:0);
  for(const c of cand.slice(0,n)){
    let best=null,bd=1e9;
    W.grid.query(c.x-420,c.y-420,c.x+420,c.y+420,o=>{if(o.type!=='thicket')return;const d=hyp(o.x-c.x,o.y-c.y);const side=(o.x-H.x)*H.nx+(o.y-H.y)*H.ny;if(Math.abs(side)<H.R*0.6)return;if(d<bd){bd=d;best=o;}});
    const sgn=((c.x-H.x)*H.nx+(c.y-H.y)*H.ny)>=0?1:-1;
    if(best){c.qx=best.x;c.qy=best.y;}else{c.qx=c.x+H.nx*sgn*380-H.tx*120;c.qy=c.y+H.ny*sgn*380-H.ty*120;}
    c.quitT=14;c.quitter=true;c.state='stray';
  }
  setTimeout(()=>{if(G.state==='day')firstTime('strays');},2600);
}
function spawnSpook(){
  const H=G.herd,a=Math.random()*TAU,px=H.x+Math.cos(a)*H.R*0.7,py=H.y+Math.sin(a)*H.R*0.7;
  for(const c of G.cows){if(c.state==='lost'||c.state==='penned')continue;const d=hyp(c.x-px,c.y-py);if(d<150){c.spookT=1.6+Math.random()*1.2;c.spx=px;c.spy=py;c.panic=Math.max(c.panic,1-d/150);}}
  if(G.weather==='rain'||G.weather==='overcast'){G.flash=1;sfx('thunder');addFloat(px,py-20,'Lightning!','#f3e7c4');}
  else addFloat(px,py-20,'Rattlesnake!','#f3e7c4');
}

/* ---- the main step ---- */
const _env={slow:1,water:false,thicket:false,field:null};
function simStep(dt){
  if(G.state==='title'){updateHerdStats();updateCows(dt,true);updateRiders(dt);updateBison(dt);updateFx(dt);return;}
  if(G.state!=='day')return;
  G.t+=dt;
  updateHerdStats();
  updateMode(dt);
  checkTriggers();
  if(G.state!=='day')return;
  runEvents();
  if(G.bot)botControl();
  updatePlayer(dt);
  if(HARD)checkGallop(dt);
  updateRiders(dt);
  updateWolves(dt);
  updateRustlers(dt);
  updateCows(dt,false);
  updateBison(dt);
  updateNpcs(dt);
  checkLosses();
  updateFx(dt);
  if(G.mode==='pen')checkPen();
  if(!G.stormTonight&&!G.stormDone&&G.D.stormBiome&&G.day>=2&&G.t>G.dayLen*0.62&&biomeOfS(G.W,G.herd.s).key===G.D.stormBiome){G.stormTonight=true;}
  if(G.t>=G.dayLen&&G.state==='day'&&!G.finished)endDay();
}
function updateMode(dt){
  const W=G.W,H=G.herd;
  if(W.river&&!G.riverDone){
    const R=W.river,yc=riverY(R,H.x),hw=riverHW(R,H.x),dy=H.y-yc;
    G.current=G.riverBase*(0.28+0.72*Math.pow(0.5+0.5*Math.sin(G.t*TAU/11+1.2),1.6));
    if(G.mode==='trail'&&dy>0&&dy<hw+240){G.mode='riverHold';G.riverHoldT=0;firstTime('river');}
    if(G.mode==='riverHold'||G.mode==='crossing'){
      G.riverHoldT+=dt;let inW=0,across=0,n=0;
      for(const c of G.cows){if(c.state==='lost')continue;n++;if(c.inWater)inW++;if(c.y<riverY(R,c.x)-riverHW(R,c.x))across++;}
      if(G.mode==='riverHold'&&((inW+across)/n>0.2||(G.riverHoldT>32&&G.riders.length))){G.mode='crossing';if(G.riverHoldT>32)callout('Your crew starts them across.',3500);}
      if(G.mode==='crossing'&&(across/n>0.86||H.y<yc-hw-140)){G.riverDone=true;G.mode='trail';callout('Across the Red River. Indian Territory lies ahead.',3800);}
    }
  }
  if((G.mode==='trail')&&H.rem<330&&!W.blockFence){G.mode='pen';firstTime('pen');}
  if(G.D.wire&&!G.seen.wire&&G.t>2){let near=false;W.grid.query(H.x-260,H.y-320,H.x+260,H.y+200,o=>{if(o.type==='fence'&&o.kind==='wire')near=true;});if(near)firstTime('wire');}
}

/* ---- player ---- */
const INPUT={down:false,sx:0,sy:0,keys:{}};
// hard mode: galloping through the middle of the herd spooks it, and keeping at it starts a stampede
function checkGallop(dt){
  const P=G.player,H=G.herd;G.spookAcc=G.spookAcc||0;G.stampCool=Math.max(0,(G.stampCool||0)-dt);
  const sp=hyp(P.vx,P.vy),inside=hyp(P.x-H.x,P.y-H.y)<H.R*0.55;
  if(G.mode==='trail'&&sp>112&&inside&&!G.stampCool){
    G.spookAcc+=dt;
    if(G.spookAcc>0.35){for(const c of G.cows){if(c.state!=='herd')continue;const d=hyp(c.x-P.x,c.y-P.y);if(d<90)c.panic=Math.max(c.panic,0.6);}
      if(!G.gallopWarned){G.gallopWarned=true;callout('Easy now! Gallop through the herd and they’ll stampede.',3200);}}
    if(G.spookAcc>1.3)liveStampede(P.x,P.y);
  }else G.spookAcc=Math.max(0,G.spookAcc-dt*0.6);
}
function liveStampede(x,y){
  G.spookAcc=0;G.stampCool=20;G.flash=0.5;sfx('thunder');
  for(const c of G.cows){if(c.state==='lost'||c.state==='penned'||c.given)continue;const d=hyp(c.x-x,c.y-y);
    c.spookT=2.2+Math.random()*1.6+(d<120?0.8:0);c.spx=x+(Math.random()-0.5)*60;c.spy=y+(Math.random()-0.5)*60;c.panic=1;}
  G.cond=Math.max(0.4,G.cond-0.02);G.stampedes=(G.stampedes||0)+1;
  callout('Stampede! Ride for the leaders and turn them back.',4200);
}
function updatePlayer(dt){
  const P=G.player;
  let tx=P.tx,ty=P.ty,active=P.hasTarget;
  if(INPUT.down&&!G.bot){const w=screenToWorld(INPUT.sx,INPUT.sy);tx=w.x;ty=w.y;P.tx=tx;P.ty=ty;P.hasTarget=true;active=true;}
  const k=INPUT.keys,kx=(k.ArrowRight||k.d?1:0)-(k.ArrowLeft||k.a?1:0),ky=(k.ArrowDown||k.s?1:0)-(k.ArrowUp||k.w?1:0);
  if(kx||ky){const l=hyp(kx,ky);tx=P.x+kx/l*90;ty=P.y+ky/l*90;active=true;P.hasTarget=false;}
  envAt(P.x,P.y,_env);
  let vx=0,vy=0;
  if(active){const ex=tx-P.x,ey=ty-P.y,ed=hyp(ex,ey);if(ed>5){const ms=P.maxS*(_env.water?0.5:_env.thicket?0.62:1)*(riverWaterAt(P.x,P.y)?0.5:1);const want=Math.min(ms,ed*2.3+18);vx=ex/ed*want;vy=ey/ed*want;}else if(!INPUT.down)P.hasTarget=false;}
  const acc=Math.min(1,dt*3.4);P.vx+=(vx-P.vx)*acc;P.vy+=(vy-P.vy)*acc;
  P.x+=P.vx*dt;P.y+=P.vy*dt;hardCollide(P,8);clampToWorld(P);
  const sp=hyp(P.vx,P.vy);if(sp>4)P.ang=angLerp(P.ang,Math.atan2(P.vy,P.vx),Math.min(1,dt*7));P.step+=sp*dt;
  if(sp>95&&Math.random()<dt*14)dust(P.x-Math.cos(P.ang)*10,P.y-Math.sin(P.ang)*10,0.8);
}

/* ---- crew ---- */
function updateRiders(dt){
  const H=G.herd,pc=PACE[G.pace],W=G.W;
  for(const r of G.riders){
    let tx,ty;
    if(G.night||G.state==='title'){
      r.orbit+=dt*0.1*r.dir;const rad=H.R*0.75+54;tx=H.x+Math.cos(r.orbit)*rad;ty=H.y+Math.sin(r.orbit)*rad;
      if(G.state==='title'){tx=H.x+Math.cos(r.orbit)*(H.R+30);ty=H.y+Math.sin(r.orbit)*(H.R+30);}
    }else if(G.mode==='pen'){
      const T=W.town,gx=T.gate.x,gy=T.gate.y;
      if(r.role==='point'){tx=gx-T.gate.hw-90;ty=gy+90;}
      else if(r.role==='swingL'){tx=gx-180;ty=gy+170;}
      else if(r.role==='swingR'){tx=gx+180;ty=gy+170;}
      else{tx=H.x+H.tx*(H.rear-50);ty=H.y+H.ty*(H.rear-50);}
    }else{
      let a=0,b=0;
      switch(r.role){
        case 'point':a=H.front+40;b=(H.right+H.left)*0.5+(H.right-H.left)*0.28;break;
        case 'swingL':a=H.front*0.3;b=H.left-36;break;
        case 'swingR':a=H.front*0.3;b=H.right+36;break;
        case 'drag':a=H.rear-pc.dragGap;b=(H.left+H.right)*0.5+Math.sin(G.t*0.45)*Math.max(0,(H.right-H.left)*0.38);break;
      }
      if(G.mode==='riverHold'){if(r.role==='drag')a=H.rear-95;if(r.role==='point')a=H.front+14;}
      if(G.mode==='crossing'&&r.role==='swingR')b=H.right+26;
      if(W.laneHalf&&(r.role==='swingL'||r.role==='swingR')){b=clamp(b,-W.laneHalf+14,W.laneHalf-14);}
      tx=H.x+H.tx*a+H.nx*b;ty=H.y+H.ty*a+H.ny*b;
    }
    const ex=tx-r.x,ey=ty-r.y,ed=hyp(ex,ey),want=Math.min(r.max,ed*1.9);
    const vx=ed>2?ex/ed*want:0,vy=ed>2?ey/ed*want:0;
    const acc=Math.min(1,dt*3);r.vx+=(vx-r.vx)*acc;r.vy+=(vy-r.vy)*acc;
    r.x+=r.vx*dt;r.y+=r.vy*dt;hardCollide(r,8);
    const sp=hyp(r.vx,r.vy);if(sp>3)r.ang=angLerp(r.ang,Math.atan2(r.vy,r.vx),Math.min(1,dt*5));r.step+=sp*dt;
  }
}

/* ---- cattle ---- */
function updateCows(dt,idle){
  const H=G.herd,W=G.W,P=G.player,cs=G.cows,pc=PACE[G.pace];
  const pspd=P?hyp(P.vx,P.vy):0,pR=84+0.34*pspd,pK=24+0.33*pspd;
  const river=W.river&&!G.riverDone?W.river:null;
  for(const c of cs){
    if(c.state==='lost')continue;

    if(G.night){c.vx*=0.85;c.vy*=0.85;continue;}
    let dx=0,dy=0,sx=0,sy=0,cx=0,cy=0,cn=0,avx=0,avy=0,an=0,close=0,nbP=0;
    for(const o of cs){if(o===c||o.state==='lost'||o.given)continue;const ex=o.x-c.x,ey=o.y-c.y,d2=ex*ex+ey*ey;if(d2>4900)continue;const d=Math.sqrt(d2)+1e-4;
      if(d<19){const k=(19-d)/19;sx-=ex/d*k;sy-=ey/d*k;}if(d<32)close++;cx+=o.x;cy+=o.y;cn++;if(d<46){avx+=o.vx;avy+=o.vy;an++;}
      if(d<26&&o.press>nbP&&(ex*o.vx+ey*o.vy)<0)nbP=o.press;}
    dx+=sx*48;dy+=sy*48;
    const leaving=c.quitT>0;
    if(cn&&!leaving){const lx=cx/cn-c.x,ly=cy/cn-c.y,ll=hyp(lx,ly);if(ll>14){dx+=lx/ll*7;dy+=ly/ll*7;}}

    if(c.state==='penned'){

    }else if(idle){

    }else if(c.state==='herd'&&G.mode==='pen'){

      if(c.y>gy+6){tx=gx+(c.x-gx)*0.35-c.x;ty=gy-24-c.y;}else{tx=T.pen.cx-c.x;ty=T.pen.cy-c.y;}
      const tl=hyp(tx,ty)||1,dr=pc.drive*0.95*(c.grazing?0.3:1);dx+=tx/tl*dr;dy+=ty/tl*dr;
    }else if(c.state==='herd'){
      // without a drag rider the herd only moseys up the trail unless somebody is pushing it

      let drive=pc.drive*dragK*(c.grazing?0.12:1)*(G.thirsty?0.85:1)*(leaving?0.15:1);
      if(G.mode==='riverHold'&&river){const gap=c.y-riverY(river,c.x)-riverHW(river,c.x);drive*=(c.press||0)>0.3?1.05:gap>60?0.45:0;}
      const tp=cowTarget(c),tx=tp.x-c.x,ty=tp.y-c.y,tl=hyp(tx,ty)||1;dx+=tx/tl*drive;dy+=ty/tl*drive;
      if(c.dc>H.R*0.65&&!leaving){const k=Math.min(1,(c.dc-H.R*0.65)/90)*10*(0.4+0.3*G.swings);dx+=(H.x-c.x)/c.dc*k;dy+=(H.y-c.y)/c.dc*k;}
    }else if(c.state==='stray'){
      const sk=G.swings===2?8:G.swings===1?5:1.5;if(c.dc<520&&c.dc>1&&!leaving){dx+=(H.x-c.x)/c.dc*sk;dy+=(H.y-c.y)/c.dc*sk;}
    }else if(c.state==='cut'){
      const grp=c.grp;if(grp&&grp.state==='drive'){dx+=grp.ex*36;dy+=grp.ey*36;}
    }

    c.wa+=(Math.random()-0.5)*dt*2.4;const wamp=(c.quitter?6.5:4.2)*(G.thirsty?1.7:1);dx+=Math.cos(c.wa)*wamp;dy+=Math.sin(c.wa)*wamp;
    if(P){const px=c.x-P.x,py=c.y-P.y,pd=hyp(px,py);if(pd<pR&&pd>0.1){const k=Math.pow(1-pd/pR,0.8);dx+=px/pd*pK*k;dy+=py/pd*pK*k;pressure=Math.max(pressure,k);}}
    for(const r of G.riders){if(r.role==='point')continue;const rx=c.x-r.x,ry=c.y-r.y,rd=hyp(rx,ry),RR=r.role==='drag'?76:62;if(rd<RR&&rd>0.1){const k=1-rd/RR,kk=r.role==='drag'?pc.dragPush:22;dx+=rx/rd*kk*k;dy+=ry/rd*kk*k;pressure=Math.max(pressure,k*0.75);}}
    const own=pressure;pressure=Math.max(pressure,nbP*0.97);c.press=Math.max(own,nbP*0.97);
    for(const w of G.wolves){if(w.state==='flee')continue;const wx=c.x-w.x,wy=c.y-w.y,wd=hyp(wx,wy);if(wd<125&&wd>0.1){const k=1-wd/125;dx+=wx/wd*72*k;dy+=wy/wd*72*k;c.panic=Math.max(c.panic,k*0.9);}}
    for(const r of G.rustlers){if(r.grp.state==='flee')continue;const rx=c.x-r.x,ry=c.y-r.y,rd=hyp(rx,ry);if(rd<74&&rd>0.1){const k=1-rd/74;dx+=rx/rd*44*k;dy+=ry/rd*44*k;}}
    if(c.spookT>0){c.spookT-=dt;const qx=c.x-c.spx,qy=c.y-c.spy,qd=hyp(qx,qy)||1;dx+=qx/qd*84;dy+=qy/qd*84;}
    if(G.thirsty&&!c.drank&&!idle){if(!c.wt||G.t>c.wt){c.wt=G.t+0.7;c.wtgt=nearestWater(c.x,c.y,520);}if(c.wtgt){const qx=c.wtgt.x-c.x,qy=c.wtgt.y-c.y,qd=hyp(qx,qy)||1;dx+=qx/qd*24;dy+=qy/qd*24;}}
    // soft avoidance of obstacles and wire
    W.grid.query(c.x-34,c.y-34,c.x+34,c.y+34,o=>{
      if(o.solid){const ex=c.x-o.x,ey=c.y-o.y,d=hyp(ex,ey),m=o.solid+18;if(d<m&&d>0.1){const k=(m-d)/18*36;dx+=ex/d*k;dy+=ey/d*k;}}

      else if(o.type==='fence'&&!o.cut){const q=segClosest(o.x1,o.y1,o.x2,o.y2,c.x,c.y);if(q.d<18&&q.d>0.05){const k=(1-q.d/18)*52;dx+=(c.x-q.x)/q.d*k;dy+=(c.y-q.y)/q.d*k;}}
      else if(o.type==='bldg'){const qx=clamp(c.x,o.x1,o.x2),qy=clamp(c.y,o.y1,o.y2),d=hyp(c.x-qx,c.y-qy);if(d<16&&d>0.05){const k=(1-d/16)*40;dx+=(c.x-qx)/d*k;dy+=(c.y-qy)/d*k;}}
    });

      if(!inRiver&&dyr>0&&dyr<hw+40&&G.mode==='riverHold'&&pressure<0.3&&dy<0)dy*=0.05;}

  }
}
let _dustyK=0,_dustyT=-1;

/* ---- terrain queries ---- */
function envAt(x,y,out){
  const W=G.W;out.slow=1;out.water=false;out.thicket=false;out.field=null;
  W.grid.query(x-1,y-1,x+1,y+1,o=>{
    if(o.type==='thicket'){if(hyp(x-o.x,y-o.y)<o.r*0.85){out.slow=Math.min(out.slow,0.55);out.thicket=true;}}
    else if(o.type==='pond'){if(hyp(x-o.x,y-o.y)<o.r){out.water=true;out.slow=Math.min(out.slow,0.62);}}
  });
  for(const c of W.creeks){if(Math.abs(y-c.y0)<190&&Math.abs(y-creekY(c,x))<c.hw){out.water=true;out.slow=Math.min(out.slow,0.7);}}
  for(const f of W.fields){if(x>f.x1&&x<f.x2&&y>f.y1&&y<f.y2){out.field=f;out.slow=Math.min(out.slow,0.88);break;}}
  return out;
}
function riverWaterAt(x,y){const R=G.W.river;return R&&Math.abs(y-riverY(R,x))<riverHW(R,x);}
function nearestWater(x,y,maxD){
  const W=G.W;let best=null,bd=maxD;
  W.grid.query(x-maxD,y-maxD,x+maxD,y+maxD,o=>{if(o.type==='pond'||o.type==='windmill'){if(o.type==='windmill'&&!G.D.wire)return;const d=hyp(o.x-x,o.y-y);if(d<bd){bd=d;best={x:o.x,y:o.y};}}});
  for(const c of W.creeks){const yy=creekY(c,x);const d=Math.abs(yy-y);if(d<bd){bd=d;best={x,y:yy};}}
  if(W.river){const yy=riverY(W.river,x);const d=Math.abs(yy-y)-riverHW(W.river,x);if(d<bd){bd=d;best={x,y:yy};}}
  return best;
}
function waterNear(x,y,rad){return !!nearestWater(x,y,rad);}
function hardCollide(e,rad){
  const W=G.W;
  W.grid.query(e.x-rad-30,e.y-rad-30,e.x+rad+30,e.y+rad+30,o=>{
    if(o.solid){const dx=e.x-o.x,dy=e.y-o.y,d=hyp(dx,dy),m=o.solid+rad;if(d<m){if(d<0.01){e.x+=m;return;}const k=(m-d)/d;e.x+=dx*k;e.y+=dy*k;}}
    else if(o.type==='fence'&&!o.cut){const q=segClosest(o.x1,o.y1,o.x2,o.y2,e.x,e.y);if(q.d<rad){let nx,ny;if(q.d>0.01){nx=(e.x-q.x)/q.d;ny=(e.y-q.y)/q.d;}else{const L=hyp(o.x2-o.x1,o.y2-o.y1)||1;nx=-(o.y2-o.y1)/L;ny=(o.x2-o.x1)/L;}e.x=q.x+nx*rad;e.y=q.y+ny*rad;
        const vn=e.vx*nx+e.vy*ny;if(vn<0){e.vx-=vn*nx;e.vy-=vn*ny;}}}
    else if(o.type==='bldg'){const qx=clamp(e.x,o.x1,o.x2),qy=clamp(e.y,o.y1,o.y2),d=hyp(e.x-qx,e.y-qy);if(d<rad){if(d<0.01){e.y=o.y2+rad;return;}e.x=qx+(e.x-qx)/d*rad;e.y=qy+(e.y-qy)/d*rad;}}
